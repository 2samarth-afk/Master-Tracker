<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7E3DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="master.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
[hidden]{display:none!important}
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.auth-in{width:100%;max-width:400px}
.auth .mark{font-size:56px;text-align:left;margin-bottom:18px}
.auth-q{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 34px;max-width:36ch}
.auth .fields{display:grid;gap:18px}
.auth .btn{width:100%;margin-top:8px}
.auth-msg{margin:18px 0 0;color:var(--red-ink);font-size:14px}
.auth-alt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
</style>
<title>Master</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: Swiss editorial planner. Greige paper, one vermilion, heavy lowercase grotesk, red numerals, hairline rules, tiny corner metadata. */
:root{
  --bg:#E7E3DA; --paper:#EEEBE4; --surface:#DCD7CC; --raise:#EEEBE4;
  --ink:#151413; --soft:#5E5A52; --muted:#8B867C;
  --line:#CBC5B8; --line-2:#ABA597;
  --red:#E2381E; --red-ink:#B52A12; --red-wash:#F3D9D0; --on-red:#151413;
  --hero:#E2381E; --green:#E2381E; --band:#151413; --band-ink:#E7E3DA;
  --ok:#151413; --warn:#B52A12; --bad:#B52A12;
  --prev:#B3AD9F;
  --heat0:#E9D8CE; --heat1:#E8B9AB; --heat2:#E58E7C; --heat3:#E2381E; --heat4:#A3240F;
  --c-work:#E2381E; --c-study:#3D5A7A; --c-health:#62763A; --c-social:#BE8432; --c-personal:#77716A;
  --tc-red:#C3301A; --tc-blue:#2F5480; --tc-green:#3F6B35; --tc-amber:#9C6A14;
  --hl-yellow:#F2E3A2; --hl-green:#D3E2C4; --hl-rose:#F3CFC6;
  --scrim:rgba(20,19,18,.42);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Jost','Futura','Century Gothic','Helvetica Neue',Arial,sans-serif;
  --dw:800; --ds:108%;
  --gut:48px; --tb:72px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141312; --paper:#1C1B19; --surface:#262421; --raise:#1C1B19;
  --ink:#EDE9E1; --soft:#A9A397; --muted:#7F7A70;
  --line:#33302B; --line-2:#4A463F;
  --red:#F2563B; --red-ink:#F47E66; --red-wash:#3A1F18; --on-red:#141312;
  --hero:#F2563B; --green:#F2563B; --band:#EDE9E1; --band-ink:#141312;
  --ok:#EDE9E1; --warn:#F47E66; --bad:#F47E66;
  --prev:#5A554C;
  --heat0:#2F1B17; --heat1:#622A20; --heat2:#A43E2D; --heat3:#F2563B; --heat4:#F79A85;
  --c-work:#F2563B; --c-study:#7FA0C6; --c-health:#9DB46A; --c-social:#DDAA5C; --c-personal:#A9A296;
  --tc-red:#F0846F; --tc-blue:#8FB0DA; --tc-green:#92C385; --tc-amber:#E1B565;
  --hl-yellow:#514819; --hl-green:#2E4729; --hl-rose:#57302A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141312; --paper:#1C1B19; --surface:#262421; --raise:#1C1B19;
  --ink:#EDE9E1; --soft:#A9A397; --muted:#7F7A70;
  --line:#33302B; --line-2:#4A463F;
  --red:#F2563B; --red-ink:#F47E66; --red-wash:#3A1F18; --on-red:#141312;
  --hero:#F2563B; --green:#F2563B; --band:#EDE9E1; --band-ink:#141312;
  --ok:#EDE9E1; --warn:#F47E66; --bad:#F47E66;
  --prev:#5A554C;
  --heat0:#2F1B17; --heat1:#622A20; --heat2:#A43E2D; --heat3:#F2563B; --heat4:#F79A85;
  --c-work:#F2563B; --c-study:#7FA0C6; --c-health:#9DB46A; --c-social:#DDAA5C; --c-personal:#A9A296;
  --tc-red:#F0846F; --tc-blue:#8FB0DA; --tc-green:#92C385; --tc-amber:#E1B565;
  --hl-yellow:#514819; --hl-green:#2E4729; --hl-rose:#57302A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-type="serif"]{ --display:'Playfair Display',Georgia,serif; --body:'Playfair Display',Georgia,serif; --dw:700; --ds:100%; }
@media (max-width:1180px){ :root{ --tb:96px; } }
@media (max-width:760px){ :root{ --gut:20px; --tb:92px; } }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:inherit;text-wrap:balance}
p{margin:0}
::selection{background:var(--red-wash)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tnum{font-variant-numeric:lining-nums tabular-nums}
.it{font-style:normal}
.d{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:.9}
.red{color:var(--red)}
.wrap{max-width:1440px;margin:0 auto;width:100%;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.lbl,.lbl-s{font-size:12.5px;color:var(--soft);font-weight:500;letter-spacing:.01em}
.lbl-s{font-size:12px}
.muted{color:var(--soft)}
.ulink{font-size:14px;font-weight:500;border:0;border-bottom:1px solid currentColor;padding:0 0 2px;background:none;color:inherit;line-height:1.3}
.ulink:hover{color:var(--red-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:10px 20px;font:500 14px/1.2 var(--body);border-radius:0;min-height:42px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.accent{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.accent:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{background:var(--red-ink);border-color:var(--red-ink);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{background:none;border:0;padding:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);border-radius:2px}
.iconbtn:hover{color:var(--ink);background:var(--surface)}
.iconbtn:disabled{opacity:.3}
.txtbtn{background:none;border:0;padding:4px 0;color:var(--soft);font:500 13.5px var(--body)}
.txtbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.txtbtn.danger{color:var(--red-ink)}

/* Shell */
.strip{border-bottom:1px solid var(--line)}
.strip .wrap{height:36px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font-size:12.5px;color:var(--soft)}
.strip .mid{color:var(--red-ink);font-weight:500}
.strip .r{justify-self:end;background:none;border:0;color:var(--ink);font:500 12.5px var(--body);padding:6px 0}
.strip .r:hover{color:var(--red-ink)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"nav mark tools";align-items:center;column-gap:16px}
.topbar .nav{grid-area:nav} .topbar .mark{grid-area:mark} .topbar .tools{grid-area:tools}
.nav{display:flex;gap:26px;flex-wrap:nowrap;padding-left:12px;min-width:0}
.nav a{font-size:15px;color:var(--soft);font-weight:500;padding:4px 0;position:relative;display:inline-flex;align-items:baseline;white-space:nowrap}
.nav a::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-3px;width:7px;height:7px;border-radius:50%;background:transparent;transition:background .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink)}
.nav a.on::before{background:var(--red)}
.nav .nbadge{font-size:10.5px;color:var(--red-ink);font-weight:600;margin-left:3px;vertical-align:super;line-height:0}
.mark{font-family:var(--display);font-weight:900;font-stretch:var(--ds);letter-spacing:-.045em;font-size:32px;text-align:center;line-height:1;background:none;border:0;padding:0;color:var(--ink)}
.mark span{color:var(--red)}
.tools{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.bottomnav{display:none}
.fab{display:none}
@media (max-width:1180px){
  .topbar .wrap{grid-template-areas:". mark tools" "nav nav nav";row-gap:4px;padding-top:10px;padding-bottom:8px;min-height:0}
  .topbar .nav{justify-content:center;gap:24px;padding:4px 14px 2px;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
}
@media (max-width:1000px){
  .strip .l{display:none}
  .strip .wrap{grid-template-columns:1fr auto}
  .strip .mid{justify-self:start}
  .bottomnav-off{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;color:var(--soft);min-height:54px}
  .bottomnav a.on{color:var(--ink)}
  .bottomnav a.on svg{color:var(--red)}
}
@media (max-width:760px){
  .topbar .nav{justify-content:flex-start;gap:18px}
  .nav a{font-size:14px}
  .mark{font-size:28px}
  .fab{display:flex;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:46;width:56px;height:56px;border-radius:50%;background:var(--red);color:var(--on-red);border:0;align-items:center;justify-content:center;font-size:30px;line-height:1;font-weight:300}
  main{padding-bottom:60px}
}

/* Page frame */
.page{padding-top:44px;padding-bottom:110px}
.pagehead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.pagehead .meta{font-size:12.5px;color:var(--soft);margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap}
.pagetitle{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.045em;line-height:.86;font-size:clamp(58px,8.5vw,120px);color:var(--red);overflow-wrap:anywhere}
.pagetitle.sm{font-size:clamp(40px,5.4vw,78px);letter-spacing:-.035em}
.pagesub{font-size:15px;color:var(--soft);margin-top:14px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;color:var(--soft)}
@media (max-width:700px){ .pagehead{grid-template-columns:1fr} .pagehead>.toolbar{justify-content:flex-start} }

/* Section header */
.sechead{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line);color:inherit;background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;padding-left:0;padding-right:0}
.sechead .st{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:1;font-size:30px;color:var(--red)}
.sechead .spacer{flex:1}
.sechead .sm{font-size:12.5px;color:var(--soft)}
.sechead .arw{font-size:18px;color:var(--soft);transition:transform .15s,color .15s}
button.sechead:hover .arw{transform:translateX(4px);color:var(--red)}
.hl.hl{margin-inline:-12px;padding-inline:12px;transition:background .12s}
.hl:hover{background:var(--surface)}
.empty{padding:20px 0;color:var(--soft)}
.empty .big{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:30px;color:var(--ink);margin-bottom:6px;line-height:1.05}

/* Inputs */
.input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);padding:9px 0;font-size:16px;color:var(--ink);border-radius:0;outline:none}
.input:focus{border-bottom-color:var(--ink)}
.input::placeholder{color:var(--muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px;cursor:pointer}
select.input option{background:var(--paper);color:var(--ink)}
textarea.input{resize:vertical;min-height:90px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl-s{font-size:12.5px;color:var(--soft);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.fields .full{grid-column:1/-1}
@media (max-width:600px){ .fields{grid-template-columns:1fr} }
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:0;background:transparent;display:inline-grid;place-content:center;cursor:pointer;flex:none;margin:0;transition:background .12s,border-color .12s}
input[type=checkbox]::before{content:"";width:10px;height:10px;transform:scale(0);background:var(--on-red);clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);transition:transform .12s}
input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
input[type=checkbox]:checked::before{transform:scale(1)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{background:none;border:0;padding:7px 14px;font:500 13.5px var(--body);color:var(--soft);min-height:36px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin-bottom:34px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:0 0 10px;margin-bottom:-1px;font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:26px;color:var(--muted);line-height:1}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);padding:4px 11px;font-size:13px;border-radius:999px;color:var(--soft);background:none}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip button{background:none;border:0;padding:0;color:inherit;font-size:15px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ink)} .pill.warn{color:var(--red-ink)} .pill.bad{color:var(--red-ink)} .pill.none{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(6vh,calc(env(safe-area-inset-top,0px) + 16px)) 16px 16px;overflow-y:auto}
.modal{background:var(--paper);border:1px solid var(--line-2);width:100%;max-width:640px;padding:30px 32px 26px;position:relative}
.modal.wide{max-width:900px}
.modal.narrow{max-width:460px}
.modal h2{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:34px;line-height:1;color:var(--red);margin-bottom:8px;padding-right:40px}
.modal .close{position:absolute;top:14px;right:14px}
.modal .actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.modal .actions .left{margin-right:auto}
.confirmbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end;width:100%;background:var(--red-wash);padding:14px 16px;margin:-6px 0 0}
.confirmbar p{flex:1 1 260px;font-size:14.5px}
@media (max-width:600px){ .modal{padding:24px 20px} }
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line-2);z-index:82;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) 28px;display:flex;flex-direction:column;gap:22px}
.panel h2{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:34px;line-height:1;color:var(--red)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:760px){ .toasts{bottom:calc(90px + env(safe-area-inset-bottom,0px))} }
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;display:flex;gap:18px;align-items:center;font-size:14.5px}
.toast button{background:none;border:0;color:var(--red);font:600 13px var(--body);padding:0}
.pop{position:absolute;z-index:70;background:var(--paper);border:1px solid var(--line-2);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font-size:15px}
.menu button:hover,.menu button.on{background:var(--surface)}

/* Today hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;padding-top:34px;padding-bottom:34px}
.hero .meta{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--soft);padding-bottom:22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
.greet{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:1;font-size:clamp(30px,3.4vw,46px);color:var(--ink)}
.quote{font-size:16px;line-height:1.55;color:var(--soft);max-width:46ch;margin-top:16px;padding-left:16px;border-left:2px solid var(--red)}
.now{text-align:right;min-width:190px}
.now .clock{font-family:var(--display);font-weight:700;font-stretch:var(--ds);letter-spacing:-.04em;font-size:64px;line-height:.9;color:var(--ink)}
.now .clock small{font-size:22px;letter-spacing:0;font-weight:500;margin-left:4px}
.now .next{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.dayrow{display:flex;align-items:flex-start;gap:6px;margin-top:40px}
.dayname{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.055em;line-height:.78;font-size:clamp(84px,15.5vw,232px);color:var(--red);margin-left:-.04em}
.badge{width:118px;height:118px;flex:none;margin-top:-18px}
.badge text{fill:var(--ink);font:500 10px var(--body);letter-spacing:.5px}
.badge .spin{transform-origin:60px 60px;animation:spin 36s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dateline{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:22px}
.dnum{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.05em;line-height:.8;font-size:clamp(64px,8vw,116px);color:var(--red)}
.dmeta{padding-bottom:2px}
.dmeta .m{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:clamp(40px,5vw,72px);line-height:.85;color:var(--ink)}
.dmeta .s{font-size:13px;color:var(--soft);margin-top:8px}
.vword{writing-mode:vertical-rl;font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;line-height:.85;font-size:clamp(56px,6.6vw,104px);color:var(--red);align-self:stretch;text-align:center;border-left:1px solid var(--line);padding-left:26px}
@media (max-width:1000px){ .vword{display:none} .hero{grid-template-columns:1fr} }
@media (max-width:760px){
  .hero{padding-top:22px}
  .hero-top{flex-direction:column-reverse;gap:22px}
  .now{text-align:left}
  .now .clock{font-size:48px}
  .badge{width:84px;height:84px;margin-top:-10px}
  .dayrow{margin-top:28px}
}
/* Week strip */
.week{display:flex;align-items:center;gap:8px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.week .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1 1 360px;max-width:620px;gap:2px}
.wd{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink);min-width:0}
.wd .w{font-size:12px;color:var(--soft)}
.wd .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--body);transition:background .12s}
.wd:hover .n{background:var(--surface)}
.wd.today .n{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wd.on .n{background:var(--red);color:var(--on-red);box-shadow:none}
.wd .pip{width:4px;height:4px;border-radius:50%;background:transparent}
.wd .pip.has{background:var(--ink)}
.week .ctl{display:flex;align-items:center;gap:2px}
/* Summary numerals */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.summary a{display:block;padding:24px 0 26px;color:var(--ink)}
.summary a+a{padding-left:36px;border-left:1px solid var(--line)}
.summary .k{font-size:13px;color:var(--soft)}
.summary .num{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.05em;line-height:.9;font-size:clamp(52px,6vw,84px);color:var(--red);margin-top:10px}
.summary .num span{color:var(--muted)}
.summary .go{font-size:13.5px;font-weight:500;margin-top:12px;display:inline-block;border-bottom:1px solid currentColor}
.summary a:hover .go{color:var(--red-ink)}
@media (max-width:760px){ .summary{grid-template-columns:1fr} .summary a{padding:18px 0} .summary a+a{padding-left:0;border-left:0;border-top:1px solid var(--line)} }

/* Body blocks */
.twocol{display:flex;flex-wrap:wrap;gap:64px}
.twocol>.main{flex:2 1 520px;min-width:0}
.twocol>.side{flex:1 1 340px;min-width:0}
.block{margin-bottom:58px}
.sched{display:grid;grid-template-columns:118px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 0;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink);font-size:16px}
.sechead + .sched{border-top:0}
.sched.past{opacity:.45}
.sched.cur{box-shadow:inset 3px 0 0 var(--red);background:var(--paper)}
.sched.cur.hl{padding-left:15px}
.sched .t{font-size:14px;color:var(--soft)}
.sched.cur .t{color:var(--ink)}
.sched .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched .c{font-size:12.5px;color:var(--soft);display:flex;align-items:center;gap:7px}
.taskrow{display:flex;align-items:center;gap:14px;padding:11px 0;min-height:48px;font-size:16px}
.taskrow+.taskrow{border-top:1px solid var(--line)}
.taskrow .n{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit;font-size:16px;overflow-wrap:anywhere}
.taskrow.done .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.taskrow .meta{font-size:13px;color:var(--soft);white-space:nowrap}
.taskrow .tm{font-size:14px;color:var(--soft);width:54px;flex:none}
.taskrow .num{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;color:var(--red);font-size:18px;width:26px;flex:none}
.taskrow.done .num{color:var(--muted)}
.grp-l{font-size:12.5px;color:var(--soft);margin:18px 0 4px;font-weight:500}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;min-height:52px}
.logrow+.logrow{border-top:1px solid var(--line)}
.logrow .n{font-size:16px;background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.goalrow{padding:14px 0 16px;width:100%}
.goalrow+.goalrow{border-top:1px solid var(--line)}
.goalrow .t{font-size:16px;background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:500}
.goalrow .t:hover{color:var(--red-ink)}
.bar{height:3px;background:var(--line);flex:1;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.welcome{border:1px solid var(--line-2);padding:26px 28px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:52px;background:var(--paper)}
.welcome h3{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:30px;line-height:1;color:var(--red)}
.inlinelog{background:var(--paper);border:1px solid var(--line);padding:14px 16px;margin-top:12px}

/* Metric inputs */
.mi{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mi .val{font-size:16px}
.mi input.num{width:96px;text-align:right;background:transparent;border:0;border-bottom:1px solid var(--line-2);padding:4px 2px;font-size:15px;color:var(--ink);outline:none}
.mi input.num:focus{border-bottom-color:var(--ink)}
.mi input.note{width:130px;background:transparent;border:0;border-bottom:1px dotted var(--line-2);padding:4px 2px;font-size:13.5px;color:var(--ink);outline:none}
.mi input.note:focus{border-bottom:1px solid var(--ink)}
.mi .step{width:32px;height:32px;border:1px solid var(--line-2);background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);font-size:16px}
.mi .step:hover{color:var(--ink);border-color:var(--ink)}
.mi .unit{font-size:13px;color:var(--soft)}
.yn{border:1px solid var(--line-2);background:none;padding:6px 12px;font:500 13px var(--body);color:var(--soft);min-height:34px}
.yn:hover{border-color:var(--ink);color:var(--ink)}
.yn.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.rate{display:flex;gap:5px}
.rate button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:none;padding:0}
.rate button.on{background:var(--red);border-color:var(--red)}
.okmark{color:var(--red-ink);font-size:15px;font-weight:600}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.mcard{border:1px solid var(--line);padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--paper)}
.mcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mcard .name{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:24px;line-height:1;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.mcard .name:hover{color:var(--red)}
.mcard .big{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:44px;line-height:1;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:4px 0 40px}
.stats>div{padding:18px 18px 18px 0}
.stats>div+div{padding-left:18px;border-left:1px solid var(--line)}
.stats .v{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:38px;line-height:1;margin-top:8px;color:var(--red)}
.stats .v span{font-family:var(--body);font-size:15px;letter-spacing:0;font-weight:500;color:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12.5px;color:var(--soft);font-weight:500;padding:10px 12px 10px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tblwrap{overflow-x:auto}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Goals */
.gcard{border:1px solid var(--line);background:var(--paper);padding:24px;display:flex;flex-direction:column;gap:14px;text-align:left;color:inherit;width:100%;min-width:0;position:relative}
.gcard:hover{border-color:var(--line-2)}
.gcard h3{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:28px;line-height:1;color:var(--ink);background:none;border:0;padding:0;text-align:left}
.gcard h3:hover{color:var(--red)}
.gcard .pct{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:40px;line-height:.9;color:var(--red)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
@media (max-width:420px){ .gcards,.cards{grid-template-columns:1fr} }
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.typecard{border:1px solid var(--line-2);background:none;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit}
.typecard:hover{border-color:var(--ink)}
.typecard.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.typecard.on .muted{color:var(--bg);opacity:.72}
.typecard b{font-size:16px;font-weight:600}
.typecard .muted{font-size:13px;line-height:1.35}
.chartpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chartpick label{border:1px solid var(--line-2);padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.chartpick label.dis{opacity:.38;cursor:not-allowed}
.chartpick label.rec{border-color:var(--red)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:24px}
@media (max-width:520px){ .charts{grid-template-columns:1fr} }
.chartbox{border:1px solid var(--line);padding:20px 20px 16px;background:var(--paper);min-width:0;position:relative}
.chartbox .ch-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.chartbox .ch-head .t{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:22px;line-height:1;color:var(--ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--soft);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;font-size:13px;line-height:1.4;z-index:5;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.tip b{font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px}
.delta{font-size:14px}
.delta.up{color:var(--ink);font-weight:500} .delta.down{color:var(--red-ink);font-weight:500}

/* Heatmap */
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;overflow-x:auto;padding:2px}
.heat button{width:13px;height:13px;border-radius:0;border:0;padding:0;background:var(--heat0)}
.heat button.l1{background:var(--heat1)} .heat button.l2{background:var(--heat2)} .heat button.l3{background:var(--heat3)} .heat button.l4{background:var(--heat4)}
.heat button.today{outline:1.5px solid var(--ink);outline-offset:1px}
.heat button.sel{outline:2px solid var(--red);outline-offset:1px}
.heatkey{display:flex;align-items:center;gap:5px}
.heatkey i{width:11px;height:11px;display:inline-block}

/* To-do */
.composer{display:flex;gap:0;align-items:stretch;border:1px solid var(--ink);background:var(--paper);margin:6px 0 40px;flex-wrap:wrap}
.composer input.t{flex:1 1 280px;border:0;background:none;padding:15px 18px;font-size:17px;outline:none;min-width:0}
.composer select{border:0;border-left:1px solid var(--line);background:none;padding:0 30px 0 16px;font:500 14px var(--body);color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;min-height:54px;cursor:pointer}
.composer select:disabled{color:var(--muted);cursor:not-allowed}
.composer button{border:0;background:var(--ink);color:var(--bg);padding:0 22px;font:500 14px var(--body);min-height:54px}
.composer button:hover{background:var(--red);color:var(--on-red)}
@media (max-width:640px){ .composer select{flex:1 1 40%;border-top:1px solid var(--line)} .composer select:first-of-type{border-left:0} .composer button{flex:1 1 100%} }
.todo-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:56px;align-items:start}
@media (max-width:960px){ .todo-layout{grid-template-columns:1fr} }
.tl{position:relative;border:1px solid var(--line);height:min(72vh,800px);overflow-y:auto;background:var(--paper);margin-top:14px}
.tl-inner{position:relative;margin-left:62px;cursor:copy}
.tl-hour{position:absolute;left:-62px;width:52px;text-align:right;font-size:12px;color:var(--soft);transform:translateY(-8px)}
.tl-slot{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.tl-slot.half{border-top-style:dotted;opacity:.75}
.tl-now{position:absolute;left:-8px;right:0;height:0;border-top:1.5px solid var(--red);z-index:6;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:0;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tl-now span{position:absolute;right:6px;top:-18px;font-size:11px;color:var(--red-ink);font-weight:600}
.tl-hint{position:absolute;left:6px;right:6px;border:1px dashed var(--line-2);color:var(--soft);font-size:12.5px;padding:3px 8px;pointer-events:none;z-index:1}
.blk{position:absolute;box-shadow:inset 3px 0 0 var(--c,var(--red));background:color-mix(in srgb,var(--c,var(--red)) 13%,var(--paper));padding:5px 8px 4px 11px;font-size:14px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:3;display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.blk:hover{z-index:4;background:color-mix(in srgb,var(--c,var(--red)) 22%,var(--paper))}
.blk.done .bt{text-decoration:line-through;color:var(--soft)}
.blk.drag{opacity:.9;cursor:grabbing;z-index:7;outline:1px solid var(--c,var(--red))}
.blk .bt{flex:1;min-width:0;overflow:hidden;font-weight:500}
.blk .bt small{display:block;font-size:12px;color:var(--soft);font-weight:400}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk input[type=checkbox]{width:16px;height:16px;margin-top:1px}
.blk input[type=checkbox]::before{width:9px;height:9px}
.evctx{position:absolute;z-index:2;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px);border-left:2px solid var(--line-2);padding:4px 8px;font-size:12.5px;color:var(--soft);overflow:hidden;cursor:pointer}
.evctx:hover{color:var(--ink)}
.tl-new{position:absolute;left:4px;right:4px;z-index:8;background:var(--paper);border:1.5px solid var(--ink);padding:4px 8px}
.tl-new input{width:100%;border:0;background:none;outline:none;font-size:14px}
.ghostblk{position:absolute;left:4px;right:4px;background:color-mix(in srgb,var(--red) 16%,transparent);border:1px dashed var(--red);z-index:2;pointer-events:none;font-size:12px;padding:3px 6px;color:var(--ink)}
.dropzone{outline:2px dashed var(--red);outline-offset:-2px}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:1000px){ .cal-wrap{grid-template-columns:1fr} .cal-rail{order:2} }
.cal-rail{display:flex;flex-direction:column;gap:34px}
.cal-head{display:grid;border-bottom:1px solid var(--ink);margin-left:58px}
.cal-head .dh{padding:8px 8px 10px;border-left:1px solid var(--line);min-width:0;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.cal-head .dh:hover{background:var(--surface)}
.cal-head .dh .d2{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:30px;line-height:1}
.cal-head .dh.today .d2{color:var(--red)}
.cal-allday{display:grid;margin-left:58px;border-bottom:1px solid var(--line);min-height:30px}
.cal-allday>div{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-grid{position:relative;height:min(70vh,780px);overflow-y:auto;border:1px solid var(--line);border-top:0;background:var(--paper)}
.cal-cols{position:absolute;left:58px;right:0;top:0;display:grid}
.cal-col{position:relative;border-left:1px solid var(--line);cursor:copy}
.cal-col.we{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.adchip{font-size:12px;padding:2px 6px;box-shadow:inset 3px 0 0 var(--c);background:color-mix(in srgb,var(--c) 14%,var(--paper));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;color:var(--ink);width:100%}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--line)}
.month .mh{padding:8px;font-size:12.5px;color:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.month .mc{min-height:120px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--paper)}
.month .mc:hover{background:var(--surface)}
.month .mc.out{background:transparent;opacity:.5}
.month .mc .n{font-family:var(--display);font-weight:700;font-stretch:var(--ds);font-size:18px;letter-spacing:-.02em;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:none;border:0;color:var(--ink);padding:0}
.month .mc.today .n{background:var(--red);color:var(--on-red)}
@media (max-width:640px){ .month .mc{min-height:76px;padding:3px} .month .adchip{font-size:10px;padding:1px 3px} }

/* Notes */
.notes{display:grid;grid-template-columns:240px minmax(0,1fr);gap:44px;align-items:start}
@media (max-width:900px){ .notes{grid-template-columns:1fr} }
.rail{display:flex;flex-direction:column;gap:1px;position:sticky;top:calc(var(--tb) + 24px)}
@media (max-width:900px){ .rail{position:static;flex-direction:row;flex-wrap:wrap;gap:6px} .rail .grp,.rail .tree{display:none} }
.rail .item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 10px;font-size:15px;text-align:left;color:var(--ink);min-height:36px}
.rail .item:hover{background:var(--surface)}
.rail .item.on{background:var(--ink);color:var(--bg)}
.rail .item .c{margin-left:auto;font-size:12px;color:var(--soft)}
.rail .item.on .c{color:var(--bg);opacity:.7}
.rail .grp{margin-top:22px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;padding:0 0 6px 10px;border-bottom:1px solid var(--line)}
.rail .grp .gt{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:20px;color:var(--red);line-height:1}
@media (max-width:900px){ .rail .item{width:auto;border:1px solid var(--line-2)} }
.tree .item{padding-left:calc(10px + var(--d,0) * 16px)}

.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}

</head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ===== Core: utilities, storage, domain ===== */
const { h, render, Fragment } = preact;
const { useState, useEffect, useRef, useMemo, useLayoutEffect, useCallback } = preactHooks;
const html = htm.bind(h);

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const addMonths = (s, n) => { const d = pd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dow = s => pd(s).getDay();
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtLong = s => { const d = pd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtFull = s => { const d = pd(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = pd(s); return `${DAYS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const fmtDM = s => { const d = pd(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const weekNum = s => { const d = pd(s); const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()); t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7)); const w1 = new Date(t.getFullYear(), 0, 4); return 1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const dayOfYear = s => diffDays(`${s.slice(0, 4)}-01-01`, s) + 1;
const daysInYear = y => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
const weekStart = (s, ws) => { const k = (dow(s) - ws + 7) % 7; return addDays(s, -k); };
const monthStart = s => s.slice(0, 8) + '01';
const monthDays = s => new Date(+s.slice(0, 4), +s.slice(5, 7), 0).getDate();
const toMin = t => { if (!t) return null; const [a, b] = t.split(':').map(Number); return a * 60 + (b || 0); };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function fmtTime(t) {
  if (t == null || t === '') return '';
  const m = typeof t === 'number' ? t : toMin(t);
  if (S.settings().clock !== '12') return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
  let hh = Math.floor(m / 60) % 24; const ap = hh >= 12 ? 'pm' : 'am'; hh = hh % 12 || 12;
  return `${hh}:${pad(m % 60)} ${ap}`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const fmtDur = mins => { mins = Math.round(mins || 0); const hh = Math.floor(mins / 60), mm = mins % 60; return hh ? `${hh}h ${pad(mm)}m` : `${mm}m`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));
const round1 = v => Math.round(v * 10) / 10;
const fmtNum = v => { if (v == null || isNaN(v)) return '–'; const r = Math.abs(v) >= 100 ? Math.round(v) : round1(v); return r.toLocaleString('en-IN'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stripHtml = s => { const d = document.createElement('div'); d.innerHTML = s || ''; d.querySelectorAll('h1,h2,p,div,li,br').forEach(n => n.append(' ')); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
function parseDuration(str) {
  if (str == null) return null; str = String(str).trim().toLowerCase(); if (!str) return null;
  let m = str.match(/^(\d+(?:\.\d+)?)\s*h(?:\s*(\d+)\s*m?)?$/); if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? +m[2] : 0));
  m = str.match(/^(\d+)\s*m(in)?$/); if (m) return +m[1];
  m = str.match(/^(\d+):(\d{1,2})$/); if (m) return +m[1] * 60 + +m[2];
  m = str.match(/^(\d+(?:\.\d+)?)$/); if (m) { const v = parseFloat(m[1]); return v <= 24 ? Math.round(v * 60) : Math.round(v); }
  return null;
}

/* ---------- categories ---------- */
const CATS = [
  { id: 'work', name: 'Work' }, { id: 'study', name: 'Study' }, { id: 'health', name: 'Health' },
  { id: 'social', name: 'Social' }, { id: 'personal', name: 'Personal' },
];
const catVar = id => `var(--c-${CATS.some(c => c.id === id) ? id : 'personal'})`;
const catName = id => (CATS.find(c => c.id === id) || {}).name || 'Personal';

/* ---------- store ---------- */
const DEFAULT_SETTINGS = { name: 'Samarth', theme: 'system', clock: '24', weekStart: 1, carry: 'ask', dayStart: 6, dismissedWelcome: false, lastEod: null };
const LS_KEY = 'master-app.v1';
const DB = { db: null, mode: 'starting', docs: { s: {}, n: {} }, pending: {}, seq: {}, timers: {}, loaded: { s: false, n: false }, rev: 0, subs: new Set(), assets: null, downloads: null, error: null, localOnly: true };

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const j = JSON.parse(raw); DB.docs = j.docs || DB.docs; DB.localOnly = j.localOnly !== false; }
  } catch (e) { /* storage blocked */ }
}
let localTimer = null;
function saveLocal() {
  clearTimeout(localTimer);
  localTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ docs: DB.docs, localOnly: !DB.db })); } catch (e) { try { if (DB.db) localStorage.removeItem(LS_KEY); } catch (e2) { } }
  }, 250);
}
let rafId = 0;
function emit() { DB.rev++; memo.clear(); if (rafId) return; rafId = requestAnimationFrame(() => { rafId = 0; DB.subs.forEach(f => f()); }); }
const memo = new Map();
const cached = (key, fn) => { if (memo.has(key)) return memo.get(key); const v = fn(); memo.set(key, v); return v; };

const getDoc = (col, id) => DB.docs[col][id];
function setDoc(col, id, data) { DB.docs[col][id] = data; queueWrite(col, id); emit(); saveLocal(); }
function delDoc(col, id) { delete DB.docs[col][id]; queueWrite(col, id); emit(); saveLocal(); }
function queueWrite(col, id) {
  const key = col + '/' + id;
  DB.seq[key] = (DB.seq[key] || 0) + 1; DB.pending[key] = true;
  clearTimeout(DB.timers[key]);
  DB.timers[key] = setTimeout(() => flush(col, id), 450);
}
async function flush(col, id, retry = 0) {
  const key = col + '/' + id;
  if (!DB.db) return; // local mode: localStorage already holds it
  const seq = DB.seq[key];
  const data = DB.docs[col][id];
  try {
    const ref = DB.db.collection(col).doc(id);
    if (data) await ref.set(clone(data)); else await ref.delete();
    if (DB.seq[key] === seq) delete DB.pending[key];
  } catch (e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && retry < 2) { setTimeout(() => flush(col, id, retry + 1), 800 + Math.random() * 900); return; }
    delete DB.pending[key];
    if (code === 'quota_exceeded') toast('Storage is full. Delete old notes or entries to save new ones.');
    else if (code === 'invalid_argument') toast('That item is too large to save. Shorten it or remove an image.');
    else toast('Could not save a change. It is kept on this device and will retry when you edit again.');
  }
}
function flushAll() { Object.keys(DB.timers).forEach(k => { clearTimeout(DB.timers[k]); const [c, ...r] = k.split('/'); if (DB.pending[k]) flush(c, r.join('/')); }); }

async function connectDb() {
  if (!window.claude || !window.claude.use) { DB.mode = 'local'; emit(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { DB.mode = 'local'; emit(); return; }
  DB.db = db; DB.mode = 'syncing'; emit();
  const hadLocal = DB.localOnly && (Object.keys(DB.docs.s).length + Object.keys(DB.docs.n).length) > 0;
  const localCopy = clone(DB.docs);
  let firstDone = { s: false, n: false };
  ['s', 'n'].forEach(col => {
    db.collection(col).onSnapshot(snap => {
      if (!firstDone[col] && !snap.metadata.fromCache) {
        firstDone[col] = true;
        const next = {};
        snap.docs.forEach(d => { next[d.id] = clone(d.data()); });
        Object.keys(DB.pending).forEach(k => { const [c, ...r] = k.split('/'); const id = r.join('/'); if (c === col) { if (DB.docs[col][id]) next[id] = DB.docs[col][id]; else delete next[id]; } });
        DB.docs[col] = next;
        DB.loaded[col] = true;
        if (firstDone.s && firstDone.n) afterFirstLoad();
      } else {
        snap.docChanges().forEach(ch => {
          const id = ch.doc.id; if (DB.pending[col + '/' + id]) return;
          if (ch.type === 'removed') delete DB.docs[col][id]; else DB.docs[col][id] = clone(ch.doc.data());
        });
      }
      emit(); saveLocal();
    }, err => { DB.error = err && err.code; DB.mode = 'local'; emit(); });
  });
  function afterFirstLoad() {
    DB.mode = 'synced'; DB.localOnly = false;
    const serverEmpty = Object.keys(DB.docs.s).length + Object.keys(DB.docs.n).length === 0;
    if (serverEmpty && hadLocal) {
      ['s', 'n'].forEach(col => Object.entries(localCopy[col]).forEach(([id, d]) => { DB.docs[col][id] = d; queueWrite(col, id); }));
      toast('Moved your saved data into your account.');
    }
    emit(); saveLocal();
  }
  // Optional capabilities
  try { DB.assets = await window.claude.use('assets'); } catch (e) { DB.assets = null; }
  try { DB.downloads = await window.claude.use('downloads'); } catch (e) { DB.downloads = null; }
  emit();
}
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

/* ---------- toasts and confirms (in-page; the viewer blocks native dialogs) ---------- */
const UI = { toasts: [], confirm: null, subs: new Set() };
const uiEmit = () => UI.subs.forEach(f => f());
function toast(text, action, ms = 5000) {
  const t = { id: uid(), text, action };
  UI.toasts = [...UI.toasts, t].slice(-3); uiEmit();
  setTimeout(() => { UI.toasts = UI.toasts.filter(x => x.id !== t.id); uiEmit(); }, action ? 8000 : ms);
}
function ask(opts) { return new Promise(res => { UI.confirm = { ...opts, res }; uiEmit(); }); }

/* ---------- domain accessors ---------- */
const S = {
  settings() { return { ...DEFAULT_SETTINGS, ...(getDoc('s', 'settings') || {}) }; },
  setSettings(p) { setDoc('s', 'settings', { ...(getDoc('s', 'settings') || {}), ...p }); },
  list(id) { return (getDoc('s', id) || {}).items || []; },
  setList(id, items) { setDoc('s', id, { ...(getDoc('s', id) || {}), items }); },

  /* metrics */
  metrics(all) { return S.list('metrics').filter(m => all || !m.archived).slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); },
  metric(id) { return S.list('metrics').find(m => m.id === id); },
  saveMetric(m) { const l = S.list('metrics'); const i = l.findIndex(x => x.id === m.id); const n = l.slice(); if (i >= 0) n[i] = m; else n.push({ order: l.length, ...m }); S.setList('metrics', n); },
  deleteMetric(id) {
    S.setList('metrics', S.list('metrics').filter(m => m.id !== id));
    Object.keys(DB.docs.s).filter(k => k.startsWith(`e~${id}~`)).forEach(k => delDoc('s', k));
  },
  entries(mid) {
    return cached('ent:' + mid, () => {
      const out = {};
      Object.keys(DB.docs.s).forEach(k => { if (k.startsWith(`e~${mid}~`)) Object.assign(out, DB.docs.s[k].d || {}); });
      return out;
    });
  },
  entry(mid, date) { const d = getDoc('s', `e~${mid}~${date.slice(0, 4)}`); return d && d.d ? d.d[date] : undefined; },
  setEntry(mid, date, val) {
    const id = `e~${mid}~${date.slice(0, 4)}`;
    const doc = getDoc('s', id) || { mid, year: +date.slice(0, 4), d: {} };
    const d = { ...doc.d };
    if (val == null || val.v == null || (typeof val.v === 'number' && isNaN(val.v))) delete d[date]; else d[date] = val;
    const m = S.metric(mid);
    setDoc('s', id, { ...doc, d, ...(m && m.demo ? { demo: true } : {}) });
  },

  /* goals */
  goals() { return cached('goals', () => Object.keys(DB.docs.s).filter(k => k.startsWith('g~')).map(k => DB.docs.s[k]).sort((a, b) => (a.created || '').localeCompare(b.created || ''))); },
  goal(id) { return getDoc('s', 'g~' + id); },
  saveGoal(g) { setDoc('s', 'g~' + g.id, g); },
  deleteGoal(id) { delDoc('s', 'g~' + id); Object.keys(DB.docs.s).filter(k => k.startsWith(`gl~${id}~`)).forEach(k => delDoc('s', k)); },
  /* Goal logs live in one record per goal per year, so years of entries never outgrow a single record */
  goalLogs(g) { return cached('gl:' + g.id, () => { const out = { ...(g.logs || {}) }; Object.keys(DB.docs.s).forEach(k => { if (k.startsWith(`gl~${g.id}~`)) Object.assign(out, DB.docs.s[k].d || {}); }); return out; }); },
  setGoalLogEntry(gid, date, entry) {
    const id = `gl~${gid}~${date.slice(0, 4)}`; const doc = getDoc('s', id) || { gid, year: +date.slice(0, 4), d: {} };
    const d = { ...doc.d }; if (entry == null) delete d[date]; else d[date] = entry;
    const g = S.goal(gid);
    setDoc('s', id, { ...doc, d, ...(g && g.demo ? { demo: true } : {}) });
    if (g && g.logs && g.logs[date] !== undefined) { const logs = { ...g.logs }; delete logs[date]; setDoc('s', 'g~' + gid, { ...g, logs }); }
  },

  /* tasks */
  bucketId(date) { return date ? 't~' + date.slice(0, 7) : 'backlog'; },
  allTasks() {
    return cached('alltasks', () => {
      const out = [];
      Object.keys(DB.docs.s).forEach(k => { if (k.startsWith('t~') || k === 'backlog') (DB.docs.s[k].items || []).forEach(t => out.push(t)); });
      return out;
    });
  },
  tasksOn(date, generate) {
    if (generate) S.ensureRepeats(date);
    return cached('tasks:' + date, () => ((getDoc('s', 't~' + date.slice(0, 7)) || {}).items || []).filter(t => t.date === date && !t.dropped));
  },
  backlog() { return S.list('backlog').filter(t => !t.dropped); },

/* ---------- ICS ---------- */
function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function toIcs() {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Master//EN'];
  const all = []; Object.keys(DB.docs.s).forEach(k => { if (k.startsWith('ev~') || k === 'recurring') (DB.docs.s[k].items || []).forEach(e => all.push(e)); });
  all.forEach(e => {
    const d = e.date.replace(/-/g, '');
    lines.push('BEGIN:VEVENT', `UID:${e.id}@master`, `SUMMARY:${icsEscape(e.title)}`);
    if (e.allDay) { lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${addDays(e.date, 1).replace(/-/g, '')}`); }
    else { lines.push(`DTSTART:${d}T${(e.start || '09:00').replace(':', '')}00`, `DTEND:${d}T${(e.end || e.start || '10:00').replace(':', '')}00`); }

    if (e.notes) lines.push(`DESCRIPTION:${icsEscape(e.notes)}`);

      else if (l.startsWith('DESCRIPTION')) cur.notes = val(l);

const CW = 640, CP = { l: 46, r: 16, t: 16, b: 30 };

function Frame({ labels, max, min = 0, fmt, tipFor, children, h = 220, band = true, aria, onPick }) {

/* ---------- generic overlays ---------- */
function useEsc(fn) { useEffect(() => { const k = e => { if (e.key === 'Escape') fn(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [fn]); }
function Modal({ title, sub, onClose, children, actions, size }) {
  useEsc(onClose);
  return html`<div class="scrim" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="modal ${size || ''}" role="dialog" aria-modal="true" aria-label=${title}>
      <button class="iconbtn close" aria-label="Close" onClick=${onClose}>${I.close}</button>
      ${title ? html`<h2>${title}</h2>` : null}
      ${sub ? html`<p class="muted it" style=${{ marginBottom: '22px' }}>${sub}</p>` : html`<div style=${{ height: '14px' }}></div>`}
      ${children}
      ${actions ? html`<div class="actions">${actions}</div>` : null}
    </div>
  </div>`;
}
function Panel({ title, onClose, children }) {
  useEsc(onClose);
  return html`<div class="scrim" style=${{ background: 'var(--scrim)', padding: 0 }} onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <aside class="panel" role="dialog" aria-modal="true" aria-label=${title}>
      <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px' }}><h2>${title}</h2><button class="iconbtn" aria-label="Close" onClick=${onClose}>${I.close}</button></div>
      ${children}
    </aside>
  </div>`;
}
function UiHost() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(x => x + 1); UI.subs.add(f); return () => UI.subs.delete(f); }, []);
  const c = UI.confirm;
  const done = v => { const r = c.res; UI.confirm = null; uiEmit(); r(v); };
  return html`<${Fragment}>
    <div class="toasts" role="status" aria-live="polite">${UI.toasts.map(t => html`<div class="toast"><span>${t.text}</span>${t.action ? html`<button onClick=${() => { t.action.fn(); UI.toasts = UI.toasts.filter(x => x.id !== t.id); uiEmit(); }}>${t.action.label}</button>` : null}</div>`)}</div>
    ${c ? html`<${ConfirmBox} c=${c} done=${done} />` : null}
  <//>`;
}
function ConfirmBox({ c, done }) {
  const [typed, setTyped] = useState('');
  const ok = !c.typed || typed.trim().toUpperCase() === c.typed;
  return html`<${Modal} title=${c.title} sub=${c.body} size="narrow" onClose=${() => done(false)} actions=${html`<button class="btn ghost" onClick=${() => done(false)}>${c.cancel || 'Cancel'}</button><button class=${'btn' + (c.danger ? ' danger' : '')} disabled=${!ok} onClick=${() => done(true)}>${c.confirm || 'Confirm'}</button>`}>
    ${c.typed ? html`<div class="field"><label for="typed-confirm">Type ${c.typed} to confirm</label><input id="typed-confirm" class="input" value=${typed} onInput=${e => setTyped(e.target.value)} autofocus /></div>` : null}
  <//>`;
}

/* ---------- metric input, by type ---------- */
function MetricInput({ m, date, compact }) {
  const e = S.entry(m.id, date); const v = e ? e.v : null;
  const set = val => S.setEntry(m.id, date, val == null ? null : { ...(e || {}), v: val });
  const [draft, setDraft] = useState(null);
  if (m.type === 'yesno') return html`<div class="mi">${v ? html`<input class="note" aria-label=${`Detail for ${m.name}`} placeholder="detail" value=${(e && e.n) || ''} onChange=${ev => S.setEntry(m.id, date, { ...(S.entry(m.id, date) || { v: 1 }), n: ev.target.value })} />` : null}<button class="yn ${v ? 'on' : ''}" aria-pressed=${!!v} onClick=${() => set(v ? null : 1)}>${v ? 'Done ✓' : 'Mark done'}</button></div>`;
  if (m.type === 'rating') return html`<div class="rate" role="radiogroup" aria-label=${m.name}>${[1, 2, 3, 4, 5].map(i => html`<button class=${v != null && i <= v ? 'on' : ''} role="radio" aria-checked=${v === i} aria-label=${`${i} of 5`} onClick=${() => set(v === i ? null : i)}></button>`)}</div>`;
  if (m.type === 'count') return html`<div class="mi"><button class="step" aria-label="Decrease" onClick=${() => set(v == null || v <= 1 ? (v == 1 ? 0 : null) : v - 1)}>−</button><span class="val tnum" style=${{ minWidth: '28px', textAlign: 'center' }}>${v ?? 0}</span><button class="step" aria-label="Increase" onClick=${() => set((v || 0) + 1)}>+</button></div>`;
  const shown = draft != null ? draft : v == null ? '' : m.type === 'duration' ? fmtDur(v) : String(v);
  const commit = () => { if (draft == null) return; const t = draft.trim(); setDraft(null); if (!t) { set(null); return; } const nv = m.type === 'duration' ? parseDuration(t) : parseFloat(t.replace(',', '.')); if (nv == null || isNaN(nv)) { toast(m.type === 'duration' ? 'Enter a time like 7h 30m, 7:30 or 90m.' : 'Enter a number.'); return; } set(nv); };
  const met = v != null && metricMet(m, v);
  return html`<div class="mi">
    <input class="num tnum" inputmode=${m.type === 'duration' ? 'text' : 'decimal'} aria-label=${`${m.name} for ${fmtShort(date)}`} placeholder=${m.type === 'duration' ? '0h 00m' : '0'} value=${shown} onInput=${ev => setDraft(ev.target.value)} onBlur=${commit} onKeyDown=${ev => { if (ev.key === 'Enter') { ev.target.blur(); } }} />
    ${m.unit && m.type === 'number' ? html`<span class="unit">${m.unit}</span>` : null}
    ${met && !compact ? html`<span class="okmark" aria-label="Target met">✓</span>` : met ? html`<span class="okmark" aria-label="Target met">✓</span>` : null}
  </div>`;
}

function QuickAdd() {
  const close = () => setV({ quick: null });
  const mode = V.quick;
  const t0 = todayStr();
  const [f, setF] = useState({ title: '', time: '', end: '', date: t0, kind: 'fullDay', metric: (S.metrics()[0] || {}).id, body: '' });
  const up = p => setF({ ...f, ...p });
  if (mode === 'menu') return html`<${Modal} title="quick add" size="narrow" onClose=${close}>
    <div class="menu" style=${{ display: 'grid', gap: '4px' }}>
      ${[['todo', 'New to-do', 'Today, with or without a time'], ['note', 'New note', 'Opens a blank page'], ['log', 'Log a metric', 'Record today’s value']].map(([k, a, b]) => html`<button style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '12px', padding: '16px 12px', borderBottom: '1px solid var(--line)' }} onClick=${() => { if (k === 'note') { setV({ quick: null }); newNote({ kind: 'inbox' }); } else setV({ quick: k }); }}><span class="d" style=${{ fontSize: '24px', letterSpacing: '-.03em' }}>${a.toLowerCase()}</span><span class="muted" style=${{ fontSize: '14px' }}>${b}</span></button>`)}
    </div>
  <//>`;
  const save = () => {
    if (mode === 'todo') { if (!f.title.trim()) return; const timed = !!f.time && f.kind === 'timed'; S.saveTask({ id: uid(), title: f.title.trim(), date: f.date, kind: timed ? 'timed' : 'fullDay', start: timed ? f.time : null, dur: 30, due: !timed && f.time ? f.time : null, cat: 'personal', done: false }); toast('Added to ' + (f.date === t0 ? 'today' : fmtShort(f.date)) + '.'); }
    if (mode === 'note') { if (!f.title.trim() && !f.body.trim()) return; const id = uid(); S.saveNote({ id, title: f.title.trim(), body: f.body.trim() ? `<p>${esc(f.body.trim()).replace(/\n/g, '<br>')}</p>` : '', folderId: null, tags: [], createdAt: new Date().toISOString() }); toast('Saved to Inbox.', { label: 'Open', fn: () => openNote(id) }); }
    if (mode === 'log') { if (!f.metric) return; toast('Logged.'); }
    if (mode === 'event') { if (!f.title.trim() || !f.time) { toast('Add a title and a start time.'); return; } const st = toMin(f.time); const en = f.end ? toMin(f.end) : st + 60; S.saveEvent({ id: uid(), title: f.title.trim(), date: f.date, start: f.time, end: fromMin(Math.min(1440, Math.max(st + 15, en))), allDay: false, cat: 'personal' }); toast('Event added.'); }
    close();
  };
  const onKey = e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); save(); } };
  const m = S.metric(f.metric);
  const titles = { todo: 'new to-do', note: 'new note', log: 'log a metric', event: 'new event' };
  return html`<${Modal} title=${titles[mode]} size="narrow" onClose=${close} actions=${html`<button class="btn ghost left" onClick=${() => setV({ quick: 'menu' })}>Back</button><button class="btn" onClick=${save}>${mode === 'log' ? 'Done' : 'Save'}</button>`}>
    <div class="fields" onKeyDown=${onKey}>
      ${mode === 'todo' ? html`
        <div class="field full"><label for="qa-t">Task</label><input id="qa-t" class="input" autofocus value=${f.title} onInput=${e => up({ title: e.target.value })} placeholder="What needs doing" /></div>
        <div class="field"><label for="qa-d">Day</label><input id="qa-d" type="date" class="input" value=${f.date} onInput=${e => up({ date: e.target.value })} /></div>
        <div class="field"><label for="qa-k">Kind</label><select id="qa-k" class="input" value=${f.kind} onChange=${e => up({ kind: e.target.value })}><option value="fullDay">Full-day (anytime)</option><option value="timed">Scheduled slot</option></select></div>
        <div class="field full"><label for="qa-tm">${f.kind === 'timed' ? 'Start time' : 'Due by (optional)'}</label><input id="qa-tm" type="time" step="1800" class="input" value=${f.time} onInput=${e => up({ time: e.target.value })} /></div>` : null}
      ${mode === 'note' ? html`

/* ---------- global search ---------- */
function SearchOverlay() {
  const [q, setQ] = useState(''); const [sel, setSel] = useState(0);
  const close = () => setV({ overlay: null });
  useEsc(close);
  const res = useMemo(() => searchAll(q), [q, DB.rev]);
  const flat = res.flatMap(g => g.items);
  const openHit = it => {
    close();
    if (it.kind === 'note') openNote(it.id);
    else if (it.kind === 'task') { if (it.date) go('todo', { todoDate: it.date }); else go('todo'); }
    else if (it.kind === 'goal') go('goals', { id: it.id });
    else if (it.kind === 'metric') go('tracker', { id: it.id });
    else if (it.kind === 'folder') go('notes', { notesView: { kind: 'folder', id: it.id } });
  };
  const key = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(flat.length - 1, s + 1)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
    if (e.key === 'Enter' && flat[sel]) openHit(flat[sel]);
  };
  let k = -1;
  return html`<div class="scrim" onMouseDown=${e => { if (e.target === e.currentTarget) close(); }}>
    <div class="search" role="dialog" aria-modal="true" aria-label="Search everything">
      <div class="q">${I.search}<input autofocus aria-label="Search everything" placeholder="Search notes, tasks, goals, metrics, events" value=${q} onInput=${e => { setQ(e.target.value); setSel(0); }} onKeyDown=${key} /><span class="kbd">Esc</span></div>
      <div class="res">
        ${!q ? html`<p class="muted it" style=${{ padding: '16px 22px' }}>Search every part of the app. To search notes only, use the search box inside Notes.</p>` : null}
        ${q && !flat.length ? html`<p class="muted it" style=${{ padding: '16px 22px' }}>Nothing matches “${q}”.</p>` : null}
        ${res.map(g => html`<div><div class="grp lbl-s">${g.group}</div>${g.items.map(it => { k++; const i = k; return html`<button class=${'hit' + (i === sel ? ' on' : '')} onMouseEnter=${() => setSel(i)} onClick=${() => openHit(it)}><span style=${{ fontSize: '17px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '55%' }}>${highlight(it.title || 'Untitled', q)}</span><span class="s">${highlight(it.sub || '', q)}</span></button>`; })}</div>`)}
      </div>
    </div>
  </div>`;
}

    </div>
    <div style=${{ marginTop: '34px' }}>
      <${SecHead} label="your data" />
      <div class="toolbar">
        <button class="btn ghost sm" onClick=${doExport}>Export backup</button>
        <button class="btn ghost sm" onClick=${() => fileRef.current.click()}>Import backup</button>

function ExportText() {

/* ---------- end of day: unfinished full-day tasks ---------- */
function pendingCarry() {
  const t0 = todayStr();
  return S.allTasks().filter(t => t.date && t.date < t0 && t.kind === 'fullDay' && !t.done && !t.dropped && !t.resolved && diffDays(t.date, t0) <= 14);
}
function autoCarry() {
  const mode = S.settings().carry; if (mode === 'ask') return;
  const list = pendingCarry(); if (!list.length) return;
  list.forEach(t => resolveCarry(t, mode));
}
function resolveCarry(t, how) {
  const t0 = todayStr();
  if (how === 'carry') { S.saveTask({ ...t, resolved: true, carriedTo: t0, dropped: true }); S.saveTask({ ...t, id: uid(), date: t0, carriedFrom: t.date, resolved: false }); }
  else if (how === 'backlog') { S.saveTask({ ...t, resolved: true, dropped: true }); S.saveTask({ ...t, id: uid(), date: null, resolved: false }); }
  else S.saveTask({ ...t, resolved: true, dropped: true });
}

}

function MetricForm({ m, onClose }) {
  const isNew = !m.id;
  const [f, setF] = useState({ name: '', type: 'yesno', unit: '', direction: 'up', target: '', category: '', showToday: true, agg: '', ...m, target: m.target != null ? (m.type === 'duration' ? fmtDur(m.target) : m.target) : '' });
  const up = p => setF({ ...f, ...p });
  const save = () => {
    if (!f.name.trim()) { toast('Give the metric a name.'); return; }
    let target = f.target === '' || f.target == null ? null : f.type === 'duration' ? parseDuration(f.target) : parseFloat(f.target);
    if (f.target !== '' && (target == null || isNaN(target))) { toast('Enter a valid target or leave it empty.'); return; }
    S.saveMetric({ ...m, ...f, name: f.name.trim(), target, id: m.id || uid(), agg: f.agg || defaultAgg(f.type), created: m.created || todayStr() });
    toast(isNew ? 'Metric added.' : 'Metric saved.'); onClose();
  };
  const del = async () => {
    const n = Object.keys(S.entries(m.id)).length;
    if (await ask({ title: `Delete ${m.name}?`, body: `This deletes the metric and its ${n} logged ${n === 1 ? 'entry' : 'entries'}. Archive it instead to keep the history.`, confirm: 'Delete', danger: true })) { S.deleteMetric(m.id); onClose(); go('tracker'); toast('Metric deleted.'); }
  };
  return html`<${Modal} title=${isNew ? 'new metric' : 'edit metric'} onClose=${onClose} actions=${html`
    ${!isNew ? html`<button class="txtbtn danger left" onClick=${del}>Delete</button><button class="btn ghost" onClick=${() => { S.saveMetric({ ...m, archived: true }); onClose(); go('tracker'); toast('Archived. History is kept.'); }}>Archive</button>` : null}
    <button class="btn ghost" onClick=${onClose}>Cancel</button><button class="btn" onClick=${save}>${isNew ? 'Add metric' : 'Save'}</button>`}>
    <div class="fields" onKeyDown=${e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') save(); }}>
      <div class="field full"><label for="mf-n">Name</label><input id="mf-n" class="input" autofocus value=${f.name} onInput=${e => up({ name: e.target.value })} placeholder="Sleep, Deep work, Running…" /></div>
      <div class="field full"><span class="lbl-s">Type</span><div class="typegrid">${METRIC_TYPES.map(t => html`<button type="button" class=${'typecard' + (f.type === t.id ? ' on' : '')} aria-pressed=${f.type === t.id} onClick=${() => up({ type: t.id, agg: '' })}><b>${t.name}</b><span class="muted">${t.hint}</span></button>`)}</div></div>
      ${f.type === 'number' || f.type === 'count' ? html`<div class="field"><label for="mf-u">Unit</label><input id="mf-u" class="input" value=${f.unit} onInput=${e => up({ unit: e.target.value })} placeholder="km, kg, INR, glasses" /></div>` : null}
      ${f.type !== 'yesno' ? html`<div class="field"><label for="mf-t">Daily target (optional)</label><input id="mf-t" class="input tnum" value=${f.target} onInput=${e => up({ target: e.target.value })} placeholder=${f.type === 'duration' ? '7h 30m' : f.type === 'rating' ? '4' : '10'} /></div>` : null}
      ${f.type !== 'yesno' ? html`<div class="field"><label for="mf-d">Better when</label><select id="mf-d" class="input" value=${f.direction} onChange=${e => up({ direction: e.target.value })}><option value="up">Higher is better</option><option value="down">Lower is better</option><option value="neutral">Neither</option></select></div>` : null}
      <div class="field"><label for="mf-a">Combine days by</label><select id="mf-a" class="input" value=${f.agg || defaultAgg(f.type)} onChange=${e => up({ agg: e.target.value })}><option value="sum">Total</option><option value="avg">Average</option></select></div>
      <div class="field"><label for="mf-c">Category (optional)</label><input id="mf-c" class="input" value=${f.category} onInput=${e => up({ category: e.target.value })} placeholder="Health, Work, Money" /></div>
      <div class="field full"><label class="check"><input type="checkbox" checked=${f.showToday !== false} onChange=${e => up({ showToday: e.target.checked })} /> Show on Today for quick logging</label></div>

  <//>`;
}

function MetricDetail({ m }) {
  const [edit, setEdit] = useState(false); const [compare, setCompare] = useState(false); const [type, setType] = useState('auto');
  const [newDate, setNewDate] = useState(todayStr());
  const range = V.metricRange; const t0 = todayStr();
  const e = S.entries(m.id); const map = {}; Object.keys(e).forEach(d => { if (e[d].v != null) map[d] = e[d].v; });
  const agg = m.agg || defaultAgg(m.type);
  const days = Object.keys(map).sort();
  let buckets;
  if (range === 'all') { const first = days[0] || t0; const n = Math.max(1, (+t0.slice(0, 4) - +first.slice(0, 4)) * 12 + (+t0.slice(5, 7) - +first.slice(5, 7)) + 1); buckets = Array.from({ length: Math.min(n, 60) }, (_, i) => { const f = addMonths(monthStart(t0), i - Math.min(n, 60) + 1); return { from: f, to: addDays(addMonths(f, 1), -1), label: f.slice(5, 7) === '01' || i === 0 ? f.slice(0, 4) : '', title: `${MONTHS[+f.slice(5, 7) - 1]} ${f.slice(0, 4)}` }; }); }
  else buckets = periodBuckets(range, t0, 0);
  const vals = bucketize(map, buckets, agg);
  const prev = compare && range !== 'all' ? bucketize(map, periodBuckets(range, t0, -1), agg) : null;
  const fmt = v => m.type === 'yesno' ? `${fmtNum(v)} day${v === 1 ? '' : 's'}` : fmtMetric(m, v);
  const axis = axisFmt(m.type === 'duration' ? 'duration' : 'n');
  const useLine = type === 'line' || (type === 'auto' && (range === 'all' || range === 'year' && m.type !== 'yesno' && agg === 'avg'));
  const C = useLine ? LineChart : BarChart;
  const target = (m.target != null && m.target !== '' && (agg === 'avg' || buckets[0].from === buckets[0].to)) ? +m.target : null;
  const inRange = days.filter(d => d >= buckets[0].from && d <= buckets[buckets.length - 1].to);
  const allVals = days.map(d => map[d]);
  const total = allVals.reduce((a, b) => a + b, 0);
  const best = days.length ? days.reduce((b, d) => (m.direction === 'down' ? map[d] < map[b] : map[d] > map[b]) ? d : b, days[0]) : null;
  const lvl = d => { const v = map[d]; if (v == null) return 0; if (m.type === 'yesno') return v ? 4 : 0; const mx = Math.max(...allVals) || 1; if (m.target) return metricMet(m, v) ? 4 : clamp(Math.ceil(v / (+m.target || mx) * 3), 1, 3); return clamp(Math.ceil(v / mx * 4), 1, 4); };
  const linkedGoals = S.goals().filter(g => g.metricId === m.id);
  const rows = days.slice().reverse().slice(0, 120);
  return html`<section class="wrap page">
    <button class="ulink back" onClick=${() => go('tracker')}>← all metrics</button>
    <div class="pagehead">
      <div><div class="meta"><span>tracker</span>${m.category ? html`<span>${m.category}</span>` : null}</div><h1 class="pagetitle sm">${m.name}</h1><p class="pagesub">${METRIC_TYPES.find(t => t.id === m.type).name}${m.unit ? ` in ${m.unit}` : ''}${m.target != null && m.target !== '' ? ` · target ${m.direction === 'down' ? 'at most' : 'at least'} ${fmtMetric(m, +m.target)} a day` : ''}${m.category ? ` · ${m.category}` : ''}</p></div>
      <div class="toolbar"><div style=${{ display: 'flex', alignItems: 'center', gap: '12px' }}><span class="lbl-s">Today</span><${MetricInput} m=${m} date=${t0} /></div><button class="btn ghost" onClick=${() => setEdit(true)}>Edit</button></div>
    </div>
    <div class="stats">
      ${[['Average', aggregate(allVals, 'avg')], [agg === 'sum' ? 'Total' : 'Days logged', agg === 'sum' ? total : days.length], ['Best day', best ? map[best] : null], ['Current streak', null, plural(metricStreak(m), 'day')], ['Longest streak', null, plural(metricLongest(m), 'day')], ['Days logged', null, String(days.length)]].filter((x, i) => !(i === 5 && agg !== 'sum')).map(([l, v, txt]) => html`<div><div class="lbl-s">${l}</div><div class="v tnum">${txt || (v == null ? '–' : (l === 'Days logged' ? v : m.type === 'yesno' && l === 'Average' ? Math.round(v * 100) + '%' : fmtMetric(m, v)))}</div>${l === 'Best day' && best ? html`<div class="muted" style=${{ fontSize: '13px' }}>${fmtShort(best)}</div>` : null}</div>`)}
    </div>
    <div class="chartbox">
      <div class="ch-head" style=${{ flexWrap: 'wrap' }}>
        <div class="seg" role="group" aria-label="Range">${[['week', 'Week'], ['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year'], ['all', 'All']].map(([k, l]) => html`<button class=${range === k ? 'on' : ''} aria-pressed=${range === k} onClick=${() => setV({ metricRange: k })}>${l}</button>`)}</div>
        <div class="toolbar">
          ${range !== 'all' ? html`<label class="check" style=${{ fontSize: '14px' }}><input type="checkbox" checked=${compare} onChange=${ev => setCompare(ev.target.checked)} /> Compare with previous</label>` : null}
          <div class="seg" role="group" aria-label="Chart type">${[['auto', 'Auto'], ['bar', 'Bar'], ['line', 'Line']].map(([k, l]) => html`<button class=${type === k ? 'on' : ''} onClick=${() => setType(k)}>${l}</button>`)}</div>
        </div>
      </div>
      <${C} buckets=${buckets} values=${vals} prev=${prev} fmt=${fmt} axis=${axis} target=${target} aria=${`${m.name}, ${range}`} onPick=${i => { const b = buckets[i]; if (b.from === b.to) setV({ page: 'today', todayDate: b.from === t0 ? null : b.from }); }} />
      ${prev ? html`<div class="legend"><span><i style=${{ background: 'var(--green)' }}></i>${PERIOD_NAMES[range][0]}</span><span><i style=${{ background: 'var(--prev)' }}></i>${PERIOD_NAMES[range][1]}</span></div>` : null}
      ${compareSummary(vals, prev, agg, fmt, m.direction)}
      <p class="muted" style=${{ fontSize: '13px', marginTop: '8px' }}>${inRange.length} days logged in this range. Days you skipped show as gaps, not zeros.</p>
    </div>
    <div class="twocol" style=${{ marginTop: '48px' }}>
      <div class="main">
        <${SecHead} label="entries" />
        <div class="toolbar" style=${{ marginBottom: '14px' }}><span class="muted" style=${{ fontSize: '14px' }}>Add or fix a day:</span><input type="date" class="input" style=${{ width: '170px' }} max=${t0} value=${newDate} onInput=${ev => setNewDate(ev.target.value)} aria-label="Date to log" /><${MetricInput} m=${m} date=${newDate || t0} /></div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Value</th><th>Note</th><th></th></tr></thead><tbody>
          ${rows.map(d => html`<tr><td class="tnum" style=${{ whiteSpace: 'nowrap' }}>${fmtShort(d)}</td><td><${MetricInput} m=${m} date=${d} /></td><td><input class="input" style=${{ fontSize: '14px', border: 0 }} aria-label=${`Note for ${fmtShort(d)}`} value=${e[d].n || ''} placeholder="Add a note" onChange=${ev => S.setEntry(m.id, d, { ...e[d], n: ev.target.value })} /></td><td><button class="iconbtn" aria-label=${`Delete entry for ${fmtShort(d)}`} onClick=${() => { const old = e[d]; S.setEntry(m.id, d, null); toast('Entry deleted.', { label: 'Undo', fn: () => S.setEntry(m.id, d, old) }); }}>${I.trash}</button></td></tr>`)}
          ${!rows.length ? html`<tr><td colspan="4" class="muted">No entries yet. Log today above.</td></tr>` : null}
        </tbody></table></div>
      </div>
      <div class="side">
        <${SecHead} label="last 12 months" />
        <${Heatmap} weeks=${53} level=${lvl} title=${d => `${fmtShort(d)}: ${map[d] == null ? 'not logged' : fmtMetric(m, map[d])}`} onPick=${d => setNewDate(d)} />
        <div style=${{ marginTop: '14px' }}><${HeatKey} /></div>
        ${linkedGoals.length ? html`<div style=${{ marginTop: '40px' }}><${SecHead} label="feeds these goals" />${linkedGoals.map(g => html`<button class="goalrow hl" onClick=${() => go('goals', { id: g.id })}><span style=${{ fontSize: '16px' }}>${g.title}</span></button>`)}</div>` : null}
      </div>
    </div>
    ${edit ? html`<${MetricForm} m=${m} onClose=${() => setEdit(false)} />` : null}
  </section>`;
}
/* ===== Goals ===== */

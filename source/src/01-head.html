<title>Master</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: Swiss editorial planner. Greige paper, one vermilion, heavy lowercase grotesk, red numerals, hairline rules, tiny corner metadata. */
:root{
  --bg:#E7E3DA; --paper:#EEEBE4; --surface:#DCD7CC; --raise:#EEEBE4;
  --ink:#151413; --soft:#5E5A52; --muted:#8B867C;
  --line:#CBC5B8; --line-2:#ABA597;
  --red:#E2381E; --red-ink:#B52A12; --red-wash:#F3D9D0; --on-red:#151413;
  --hero:#E2381E; --green:#E2381E; --band:#151413; --band-ink:#E7E3DA;
  --ok:#151413; --warn:#B52A12; --bad:#B52A12;
  --prev:#B3AD9F;
  --heat0:#E9D8CE; --heat1:#E8B9AB; --heat2:#E58E7C; --heat3:#E2381E; --heat4:#A3240F;
  --c-work:#E2381E; --c-study:#3D5A7A; --c-health:#62763A; --c-social:#BE8432; --c-personal:#77716A;
  --tc-red:#C3301A; --tc-blue:#2F5480; --tc-green:#3F6B35; --tc-amber:#9C6A14;
  --hl-yellow:#F2E3A2; --hl-green:#D3E2C4; --hl-rose:#F3CFC6;
  --scrim:rgba(20,19,18,.42);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Jost','Futura','Century Gothic','Helvetica Neue',Arial,sans-serif;
  --dw:800; --ds:108%;
  --gut:48px; --tb:72px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141312; --paper:#1C1B19; --surface:#262421; --raise:#1C1B19;
  --ink:#EDE9E1; --soft:#A9A397; --muted:#7F7A70;
  --line:#33302B; --line-2:#4A463F;
  --red:#F2563B; --red-ink:#F47E66; --red-wash:#3A1F18; --on-red:#141312;
  --hero:#F2563B; --green:#F2563B; --band:#EDE9E1; --band-ink:#141312;
  --ok:#EDE9E1; --warn:#F47E66; --bad:#F47E66;
  --prev:#5A554C;
  --heat0:#2F1B17; --heat1:#622A20; --heat2:#A43E2D; --heat3:#F2563B; --heat4:#F79A85;
  --c-work:#F2563B; --c-study:#7FA0C6; --c-health:#9DB46A; --c-social:#DDAA5C; --c-personal:#A9A296;
  --tc-red:#F0846F; --tc-blue:#8FB0DA; --tc-green:#92C385; --tc-amber:#E1B565;
  --hl-yellow:#514819; --hl-green:#2E4729; --hl-rose:#57302A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141312; --paper:#1C1B19; --surface:#262421; --raise:#1C1B19;
  --ink:#EDE9E1; --soft:#A9A397; --muted:#7F7A70;
  --line:#33302B; --line-2:#4A463F;
  --red:#F2563B; --red-ink:#F47E66; --red-wash:#3A1F18; --on-red:#141312;
  --hero:#F2563B; --green:#F2563B; --band:#EDE9E1; --band-ink:#141312;
  --ok:#EDE9E1; --warn:#F47E66; --bad:#F47E66;
  --prev:#5A554C;
  --heat0:#2F1B17; --heat1:#622A20; --heat2:#A43E2D; --heat3:#F2563B; --heat4:#F79A85;
  --c-work:#F2563B; --c-study:#7FA0C6; --c-health:#9DB46A; --c-social:#DDAA5C; --c-personal:#A9A296;
  --tc-red:#F0846F; --tc-blue:#8FB0DA; --tc-green:#92C385; --tc-amber:#E1B565;
  --hl-yellow:#514819; --hl-green:#2E4729; --hl-rose:#57302A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-type="serif"]{ --display:'Playfair Display',Georgia,serif; --body:'Playfair Display',Georgia,serif; --dw:700; --ds:100%; }
@media (max-width:1180px){ :root{ --tb:96px; } }
@media (max-width:760px){ :root{ --gut:20px; --tb:92px; } }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:inherit;text-wrap:balance}
p{margin:0}
::selection{background:var(--red-wash)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tnum{font-variant-numeric:lining-nums tabular-nums}
.it{font-style:normal}
.d{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:.9}
.red{color:var(--red)}
.wrap{max-width:1440px;margin:0 auto;width:100%;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.lbl,.lbl-s{font-size:12.5px;color:var(--soft);font-weight:500;letter-spacing:.01em}
.lbl-s{font-size:12px}
.muted{color:var(--soft)}
.ulink{font-size:14px;font-weight:500;border:0;border-bottom:1px solid currentColor;padding:0 0 2px;background:none;color:inherit;line-height:1.3}
.ulink:hover{color:var(--red-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:10px 20px;font:500 14px/1.2 var(--body);border-radius:0;min-height:42px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.accent{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.accent:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{background:var(--red-ink);border-color:var(--red-ink);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{background:none;border:0;padding:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);border-radius:2px}
.iconbtn:hover{color:var(--ink);background:var(--surface)}
.iconbtn:disabled{opacity:.3}
.txtbtn{background:none;border:0;padding:4px 0;color:var(--soft);font:500 13.5px var(--body)}
.txtbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.txtbtn.danger{color:var(--red-ink)}

/* Shell */
.strip{border-bottom:1px solid var(--line)}
.strip .wrap{height:36px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font-size:12.5px;color:var(--soft)}
.strip .mid{color:var(--red-ink);font-weight:500}
.strip .r{justify-self:end;background:none;border:0;color:var(--ink);font:500 12.5px var(--body);padding:6px 0}
.strip .r:hover{color:var(--red-ink)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"nav mark tools";align-items:center;column-gap:16px}
.topbar .nav{grid-area:nav} .topbar .mark{grid-area:mark} .topbar .tools{grid-area:tools}
.nav{display:flex;gap:26px;flex-wrap:nowrap;padding-left:12px;min-width:0}
.nav a{font-size:15px;color:var(--soft);font-weight:500;padding:4px 0;position:relative;display:inline-flex;align-items:baseline;white-space:nowrap}
.nav a::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-3px;width:7px;height:7px;border-radius:50%;background:transparent;transition:background .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink)}
.nav a.on::before{background:var(--red)}
.nav .nbadge{font-size:10.5px;color:var(--red-ink);font-weight:600;margin-left:3px;vertical-align:super;line-height:0}
.mark{font-family:var(--display);font-weight:900;font-stretch:var(--ds);letter-spacing:-.045em;font-size:32px;text-align:center;line-height:1;background:none;border:0;padding:0;color:var(--ink)}
.mark span{color:var(--red)}
.tools{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.bottomnav{display:none}
.fab{display:none}
@media (max-width:1180px){
  .topbar .wrap{grid-template-areas:". mark tools" "nav nav nav";row-gap:4px;padding-top:10px;padding-bottom:8px;min-height:0}
  .topbar .nav{justify-content:center;gap:24px;padding:4px 14px 2px;overflow-x:auto;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
}
@media (max-width:1000px){
  .strip .l{display:none}
  .strip .wrap{grid-template-columns:1fr auto}
  .strip .mid{justify-self:start}
  .bottomnav-off{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;color:var(--soft);min-height:54px}
  .bottomnav a.on{color:var(--ink)}
  .bottomnav a.on svg{color:var(--red)}
}
@media (max-width:760px){
  .topbar .nav{justify-content:flex-start;gap:18px}
  .nav a{font-size:14px}
  .mark{font-size:28px}
  .fab{display:flex;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:46;width:56px;height:56px;border-radius:50%;background:var(--red);color:var(--on-red);border:0;align-items:center;justify-content:center;font-size:30px;line-height:1;font-weight:300}
  main{padding-bottom:60px}
}

/* Page frame */
.page{padding-top:44px;padding-bottom:110px}
.pagehead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.pagehead .meta{font-size:12.5px;color:var(--soft);margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap}
.pagetitle{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.045em;line-height:.86;font-size:clamp(58px,8.5vw,120px);color:var(--red);overflow-wrap:anywhere}
.pagetitle.sm{font-size:clamp(40px,5.4vw,78px);letter-spacing:-.035em}
.pagesub{font-size:15px;color:var(--soft);margin-top:14px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;color:var(--soft)}
@media (max-width:700px){ .pagehead{grid-template-columns:1fr} .pagehead>.toolbar{justify-content:flex-start} }

/* Section header */
.sechead{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line);color:inherit;background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;padding-left:0;padding-right:0}
.sechead .st{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:1;font-size:30px;color:var(--red)}
.sechead .spacer{flex:1}
.sechead .sm{font-size:12.5px;color:var(--soft)}
.sechead .arw{font-size:18px;color:var(--soft);transition:transform .15s,color .15s}
button.sechead:hover .arw{transform:translateX(4px);color:var(--red)}
.hl.hl{margin-inline:-12px;padding-inline:12px;transition:background .12s}
.hl:hover{background:var(--surface)}
.empty{padding:20px 0;color:var(--soft)}
.empty .big{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:30px;color:var(--ink);margin-bottom:6px;line-height:1.05}

/* Inputs */
.input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);padding:9px 0;font-size:16px;color:var(--ink);border-radius:0;outline:none}
.input:focus{border-bottom-color:var(--ink)}
.input::placeholder{color:var(--muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px;cursor:pointer}
select.input option{background:var(--paper);color:var(--ink)}
textarea.input{resize:vertical;min-height:90px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl-s{font-size:12.5px;color:var(--soft);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.fields .full{grid-column:1/-1}
@media (max-width:600px){ .fields{grid-template-columns:1fr} }
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:0;background:transparent;display:inline-grid;place-content:center;cursor:pointer;flex:none;margin:0;transition:background .12s,border-color .12s}
input[type=checkbox]::before{content:"";width:10px;height:10px;transform:scale(0);background:var(--on-red);clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);transition:transform .12s}
input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
input[type=checkbox]:checked::before{transform:scale(1)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{background:none;border:0;padding:7px 14px;font:500 13.5px var(--body);color:var(--soft);min-height:36px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin-bottom:34px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:0 0 10px;margin-bottom:-1px;font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.03em;font-size:26px;color:var(--muted);line-height:1}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);padding:4px 11px;font-size:13px;border-radius:999px;color:var(--soft);background:none}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip button{background:none;border:0;padding:0;color:inherit;font-size:15px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ink)} .pill.warn{color:var(--red-ink)} .pill.bad{color:var(--red-ink)} .pill.none{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(6vh,calc(env(safe-area-inset-top,0px) + 16px)) 16px 16px;overflow-y:auto}
.modal{background:var(--paper);border:1px solid var(--line-2);width:100%;max-width:640px;padding:30px 32px 26px;position:relative}
.modal.wide{max-width:900px}
.modal.narrow{max-width:460px}
.modal h2{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:34px;line-height:1;color:var(--red);margin-bottom:8px;padding-right:40px}
.modal .close{position:absolute;top:14px;right:14px}
.modal .actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.modal .actions .left{margin-right:auto}
.confirmbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end;width:100%;background:var(--red-wash);padding:14px 16px;margin:-6px 0 0}
.confirmbar p{flex:1 1 260px;font-size:14.5px}
@media (max-width:600px){ .modal{padding:24px 20px} }
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line-2);z-index:82;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) 28px;display:flex;flex-direction:column;gap:22px}
.panel h2{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;font-size:34px;line-height:1;color:var(--red)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:760px){ .toasts{bottom:calc(90px + env(safe-area-inset-bottom,0px))} }
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;display:flex;gap:18px;align-items:center;font-size:14.5px}
.toast button{background:none;border:0;color:var(--red);font:600 13px var(--body);padding:0}
.pop{position:absolute;z-index:70;background:var(--paper);border:1px solid var(--line-2);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font-size:15px}
.menu button:hover,.menu button.on{background:var(--surface)}

/* Today hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;padding-top:34px;padding-bottom:34px}
.hero .meta{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--soft);padding-bottom:22px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
.greet{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.035em;line-height:1;font-size:clamp(30px,3.4vw,46px);color:var(--ink)}
.quote{font-size:16px;line-height:1.55;color:var(--soft);max-width:46ch;margin-top:16px;padding-left:16px;border-left:2px solid var(--red)}
.now{text-align:right;min-width:190px}
.now .clock{font-family:var(--display);font-weight:700;font-stretch:var(--ds);letter-spacing:-.04em;font-size:64px;line-height:.9;color:var(--ink)}
.now .clock small{font-size:22px;letter-spacing:0;font-weight:500;margin-left:4px}
.now .next{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.dayrow{display:flex;align-items:flex-start;gap:6px;margin-top:40px}
.dayname{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.055em;line-height:.78;font-size:clamp(84px,15.5vw,232px);color:var(--red);margin-left:-.04em}
.badge{width:118px;height:118px;flex:none;margin-top:-18px}
.badge text{fill:var(--ink);font:500 10px var(--body);letter-spacing:.5px}
.badge .spin{transform-origin:60px 60px;animation:spin 36s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dateline{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:22px}
.dnum{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.05em;line-height:.8;font-size:clamp(64px,8vw,116px);color:var(--red)}
.dmeta{padding-bottom:2px}
.dmeta .m{font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;font-size:clamp(40px,5vw,72px);line-height:.85;color:var(--ink)}
.dmeta .s{font-size:13px;color:var(--soft);margin-top:8px}
.vword{writing-mode:vertical-rl;font-family:var(--display);font-weight:var(--dw);font-stretch:var(--ds);letter-spacing:-.04em;line-height:.85;font-size:clamp(56px,6.6vw,104px);color:var(--red);align-self:stretch;text-align:center;border-left:1px solid var(--line);padding-left:26px}
@media (max-width:1000px){ .vword{display:none} .hero{grid-template-columns:1fr} }
@media (max-width:760px){
  .hero{padding-top:22px}
  .hero-top{flex-direction:column-reverse;gap:22px}
  .now{text-align:left}
  .now .clock{font-size:48px}
  .badge{width:84px;height:84px;margin-top:-10px}
  .dayrow{margin-top:28px}
}
/* Week strip */

.chartbox{border:1px solid var(--line);padding:20px 20px 16px;background:var(--paper);min-width:0;position:relative}

@media (max-width:640px){ .composer select{flex:1 1 40%;border-top:1px solid var(--line)} .composer select:first-of-type{border-left:0} .composer button{flex:1 1 100%} }
.todo-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:56px;align-items:start}

.tl{position:relative;border:1px solid var(--line);height:min(72vh,800px);overflow-y:auto;background:var(--paper);margin-top:14px}
.tl-inner{position:relative;margin-left:62px;cursor:copy}

.blk{position:absolute;box-shadow:inset 3px 0 0 var(--c,var(--red));background:color-mix(in srgb,var(--c,var(--red)) 13%,var(--paper));padding:5px 8px 4px 11px;font-size:14px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:3;display:flex;gap:8px;align-items:flex-start;color:var(--ink)}

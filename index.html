/* The one place goals are logged: Today's goal rows and the goal page both use it */
function GoalLog({ g, date, compact }) {
  const style = goalLogStyle(g); const daily = goalDaily(g); const v = daily[date]; const fmt = goalFmt(g);
  const amounts = goalAmounts(g); const amt = amounts[date];
  const [val, setVal] = useState(''); const t0 = todayStr();
  const linked = g.metricId && S.metric(g.metricId);
  const noteField = () => (linked && v == null) ? null : html`<input class="input" style=${{ fontSize: '14.5px', marginTop: '12px' }} aria-label="Note for this day" placeholder=${v == null && style !== 'steps' ? 'Add a note (optional)' : 'Add a note for this day'} value=${goalNote(g, date)} onChange=${e => goalLogPatch(S.goal(g.id), date, { n: e.target.value })} />`;
  if (style === 'steps') {
    if (!compact) return html`<${StepList} g=${g} />`;
    const steps = (g.steps || []).filter(s => !s.done).slice(0, 3);
    const toggle = s => S.saveGoal({ ...g, steps: (g.steps || []).map(x => x.id === s.id ? { ...x, done: !x.done, doneAt: !x.done ? new Date(date + 'T12:00:00').toISOString() : null } : x) });
    return html`<div>${steps.map(s => html`<label class="taskrow" style=${{ cursor: 'pointer', minHeight: '40px', padding: '6px 0' }}><input type="checkbox" onChange=${() => toggle(s)} /><span class="n" style=${{ fontSize: '15px' }}>${s.title}</span>${s.date ? html`<span class="meta">${fmtDM(s.date)}</span>` : null}</label>`)}${!steps.length ? html`<p class="muted">Every step is done.</p>` : null}</div>`;
  }
  if (style === 'check') {
    const unit = g.detailUnit;
    return html`<div>
      <div class="toolbar">
        <button class=${'btn' + (v != null ? ' accent' : ' ghost') + (compact ? ' sm' : '')} aria-pressed=${v != null} onClick=${() => goalLog(S.goal(g.id), date, v != null ? null : 1)}>${v != null ? 'Done ✓' : 'Mark done'}</button>
        ${unit ? html`<label class="toolbar" style=${{ gap: '8px' }}><input class="input tnum" style=${{ width: '110px', fontSize: compact ? '15px' : '18px' }} inputmode="decimal" aria-label=${`How many ${unit}`} placeholder=${`how many ${unit}`} value=${amt ?? ''} onChange=${e => { const x = e.target.value.trim(); goalLogPatch(S.goal(g.id), date, { a: x === '' ? null : parseFloat(x.replace(',', '.')) }); }} /><span class="muted">${unit}</span></label>` : null}
        ${v != null ? html`<span class="muted" style=${{ fontSize: '14px' }}>${date === t0 ? 'logged today' : 'logged ' + fmtDM(date)}</span>` : null}
      </div>
      ${noteField()}
    </div>`;
  }
  if (style === 'rating') return html`<div>
    <div class="toolbar"><div class="rate" style=${{ gap: '8px' }} role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map(i => html`<button style=${{ width: compact ? '24px' : '30px', height: compact ? '24px' : '30px' }} class=${v != null && i <= v ? 'on' : ''} role="radio" aria-checked=${v === i} aria-label=${`${i} of 5`} onClick=${() => goalLog(S.goal(g.id), date, v === i ? null : i)}></button>`)}</div>${v != null ? html`<span class="muted">${v} / 5</span>` : html`<span class="muted" style=${{ fontSize: '14px' }}>How did today go?</span>`}</div>
    ${noteField()}
  </div>`;
  const isAmt = style === 'amount';
  const commit = mode => { const n = parseFloat(String(val).replace(',', '.')); if (isNaN(n)) { toast('Enter a number.'); return; } goalLog(S.goal(g.id), date, isAmt && mode === 'add' ? (v || 0) + n : n); setVal(''); toast(isAmt && mode === 'add' ? `Added ${fmtNum(n)}${g.unit ? ' ' + g.unit : ''}.` : 'Saved.'); };
  return html`<div>
    <div class="toolbar"><input class="input tnum" style=${{ width: '130px', fontSize: compact ? '16px' : '20px' }} inputmode="decimal" aria-label=${isAmt ? 'Amount to add' : 'Measurement'} placeholder=${isAmt ? `add ${g.unit || 'amount'}` : (g.unit || 'value')} value=${val} onInput=${e => setVal(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') commit('add'); }} />
      ${isAmt ? html`<button class=${'btn' + (compact ? ' sm' : '')} onClick=${() => commit('add')}>Add</button>${!compact ? html`<button class="btn ghost" onClick=${() => commit('set')}>Set day total</button>` : null}` : html`<button class=${'btn' + (compact ? ' sm' : '')} onClick=${() => commit('set')}>Save</button>`}
      ${v != null ? html`<span class="muted tnum" style=${{ fontSize: '14px' }}>${date === t0 ? 'today' : fmtDM(date)}: <b style=${{ color: 'var(--ink)' }}>${fmt(v)}</b></span><button class="txtbtn" onClick=${() => goalLog(S.goal(g.id), date, null)}>clear</button>` : null}</div>
    ${noteField()}
  </div>`;
}

function GoalForm({ g, onClose }) {
  const isNew = !g.id; const t0 = todayStr();
  const [f, setF] = useState(() => ({ title: '', type: 'frequency', logStyle: '', times: 5, per: 'week', target: '', baseline: '', unit: '', detailUnit: '', start: t0, end: '', metricId: '', category: '', steps: [], charts: null, showTarget: true, status: 'active', ...clone(g) }));
  const [gen, setGen] = useState({ count: 12, every: 7, from: t0, prefix: 'Session' });
  const [confirm, setConfirm] = useState(null);
  const up = p => { setConfirm(null); setF(prev => ({ ...prev, ...p })); };
  const style = f.logStyle || (GOAL_TYPES.find(t => t.id === f.type) || {}).log;
  const compat = CHART_TYPES.filter(c => c.styles.includes(style)).map(c => c.id);
  const rec = (REC_CHARTS[f.type] || []).filter(c => compat.includes(c));
  const charts = (f.charts || rec).filter(c => compat.includes(c));
  const metricOk = ['check', 'amount', 'measure'].includes(style);

function Review() {
  const [period, setPeriod] = useState('week'); const [off, setOff] = useState(0); const t0 = todayStr(); const ws = S.settings().weekStart;
  let from, to, pf, pt, label;
  if (period === 'week') { from = addDays(weekStart(t0, ws), off * 7); to = addDays(from, 6); pf = addDays(from, -7); pt = addDays(from, -1); label = `${fmtDM(from)} to ${fmtDM(to)}`; }
  else if (period === 'month') { from = addMonths(monthStart(t0), off); to = addDays(addMonths(from, 1), -1); pf = addMonths(from, -1); pt = addDays(from, -1); label = `${MONTHS[+from.slice(5, 7) - 1]} ${from.slice(0, 4)}`; }
  else { const y = +t0.slice(0, 4) + off; from = `${y}-01-01`; to = `${y}-12-31`; pf = `${y - 1}-01-01`; pt = `${y - 1}-12-31`; label = String(y); }
  const key = `${period}-${from}`; const refl = S.reviews()[key] || '';
  const sumRange = (m, a, b) => { const e = S.entries(m.id); const v = Object.keys(e).filter(d => d >= a && d <= b).map(d => e[d].v); return aggregate(v, m.agg || defaultAgg(m.type)); };
  const taskRange = (a, b) => { const ts = S.allTasks().filter(t => t.date && t.date >= a && t.date <= b && !t.dropped); return [ts.filter(t => t.done).length, ts.length]; };
  const [d1, n1] = taskRange(from, to); const [d0, n0] = taskRange(pf, pt);
  return html`<div>
    <div class="toolbar" style=${{ marginBottom: '30px', justifyContent: 'space-between' }}>
      <div class="seg" role="group" aria-label="Review period">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, l]) => html`<button class=${period === k ? 'on' : ''} onClick=${() => { setPeriod(k); setOff(0); }}>${l}</button>`)}</div>
      <div class="daynav" style=${{ display: 'flex', alignItems: 'center', gap: '6px' }}><button class="iconbtn" aria-label="Previous period" onClick=${() => setOff(off - 1)}>${I.left}</button><span class="d" style=${{ fontSize: '28px', minWidth: '200px', textAlign: 'center', letterSpacing: '-.03em' }}>${label.toLowerCase()}</span><button class="iconbtn" aria-label="Next period" disabled=${off >= 0} onClick=${() => setOff(Math.min(0, off + 1))}>${I.right}</button></div>
    </div>
    <div class="twocol">
      <div class="main">
        <${SecHead} label="tracker" />

/* ===== Calendar ===== */
const HOUR_H = 48; const MIN_PX = HOUR_H / 60;
function Calendar() {

  else { title = `${MONTHS[+date.slice(5, 7) - 1]} ${date.slice(0, 4)}`; }
  const shift = dir => setDate(view === 'day' ? addDays(date, dir) : view === 'week' ? addDays(date, 7 * dir) : addMonths(monthStart(date), dir));
  const visible = e => !hidden.includes(e.cat || 'personal');
  const open = V.calOpen; const openEv = open ? (open.id === 'new' ? open : (() => { const base = S.findEvent(open.id); if (!base) return null; return base.rule ? { ...base, id: base.id + '@' + open.date, baseId: base.id, date: open.date, recurring: true } : base; })()) : null;
  const closePanel = () => setV({ calOpen: null });
  const unscheduled = S.tasksOn(t0, true).filter(t => !t.done && t.kind !== 'timed' && !t.eventId);
  const importIcs = e => { const file = e.target.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { try { const evs = parseIcs(rd.result); evs.forEach(ev => S.saveEvent(ev, true)); toast(`Imported ${evs.length} event${evs.length === 1 ? '' : 's'}.`); } catch (err) { toast('That file could not be read as a calendar.'); } }; rd.readAsText(file); e.target.value = ''; };
  const exportIcs = async () => { const r = await offerFile('master-calendar.ics', toIcs()); if (r === null) setV({ overlay: 'exporttext', exportPayload: { title: 'Copy your calendar', sub: 'Saving files is not available here. Copy this into a file named master-calendar.ics.', text: toIcs() } }); else if (r) toast('Calendar exported.'); };

        <button class="btn accent" onClick=${() => setV({ calOpen: { id: 'new', date: view === 'month' ? (date.slice(0, 7) === t0.slice(0, 7) ? t0 : monthStart(date)) : (days.includes(t0) ? t0 : days[0]), start: '09:00', end: '10:00', title: '', cat: 'personal', allDay: false } })}>New event</button>
      </div>
    </div>

function TimeGrid({ days, visible, draft, setDraft }) {
  const box = useRef(); const cols = useRef(); const t0 = todayStr(); const nm = nowMin();
  const [drag, setDrag] = useState(null); const [title, setTitle] = useState(''); const liveD = useRef(false);
  useEffect(() => { if (box.current) box.current.scrollTop = Math.max(0, S.settings().dayStart * HOUR_H - 6); }, [days[0], days.length]);
  const n = days.length; const gridCols = `repeat(${n}, minmax(0,1fr))`;
  const at = (clientX, clientY) => { const r = cols.current.getBoundingClientRect(); const ci = clamp(Math.floor((clientX - r.left) / (r.width / n)), 0, n - 1); const m = clamp(Math.round((clientY - r.top) / MIN_PX / 15) * 15, 0, 1440); return { ci, m }; };
  const evsByDay = days.map(d => S.eventsOn(d).filter(visible));
  const startCreate = e => { if (e.button !== 0 || e.target !== e.currentTarget) return; const p = at(e.clientX, e.clientY); e.currentTarget.setPointerCapture(e.pointerId); setDrag({ kind: 'new', ci: p.ci, a: p.m, b: p.m + 60, moved: false, y0: e.clientY }); };
  const moveCreate = e => { if (!drag || drag.kind !== 'new') return; const p = at(e.clientX, e.clientY); const moved = drag.moved || Math.abs(e.clientY - drag.y0) > 6; setDrag({ ...drag, b: moved ? Math.max(drag.a + 15, p.m) : drag.a + 60, moved }); };
  const endCreate = () => { if (!drag || drag.kind !== 'new') return; liveD.current = true; setDraft({ date: days[drag.ci], start: fromMin(drag.a), end: fromMin(Math.min(1440, drag.b)) }); setTitle(''); setDrag(null); };
  const saveDraft = () => { if (!liveD.current) return; liveD.current = false; const tt = title.trim(); if (tt && draft) S.saveEvent({ id: uid(), title: tt, date: draft.date, start: draft.start, end: draft.end, allDay: false, cat: 'personal' }); setDraft(null); setTitle(''); };
  const evDown = (e, ev, mode) => { if (e.button !== 0) return; e.stopPropagation(); e.currentTarget.setPointerCapture(e.pointerId); setDrag({ kind: mode, ev, x0: e.clientX, y0: e.clientY, ci0: days.indexOf(ev.date), s0: toMin(ev.start), e0: toMin(ev.end), ci: days.indexOf(ev.date), s: toMin(ev.start), e: toMin(ev.end), moved: false, alt: e.altKey }); };
  const evMove = e => {
    if (!drag || drag.kind === 'new') return; const dy = e.clientY - drag.y0; const dm = Math.round(dy / MIN_PX / 15) * 15; const moved = drag.moved || Math.abs(dy) > 4 || Math.abs(e.clientX - drag.x0) > 6;
    if (drag.kind === 'move') { const p = at(e.clientX, e.clientY); const len = drag.e0 - drag.s0; const s = clamp(drag.s0 + dm, 0, 1440 - len); setDrag({ ...drag, ci: p.ci, s, e: s + len, moved }); }
    else setDrag({ ...drag, e: clamp(drag.e0 + dm, drag.s0 + 15, 1440), moved });
  };
  const evUp = () => {
    if (!drag || drag.kind === 'new') return; const d = drag; setDrag(null);
    if (!d.moved) { setV({ calOpen: { id: d.ev.baseId || d.ev.id, date: d.ev.date } }); return; }
    const nd = days[d.ci]; const patch = { date: nd, start: fromMin(d.s), end: fromMin(d.e) };
    if (d.alt) { const c = { ...d.ev, ...patch, id: uid() }; delete c.rule; delete c.taskId; S.saveEvent(c, true); toast('Event duplicated.'); return; }
    if (d.ev.recurring) { const base = S.findEvent(d.ev.baseId); S.saveEvent({ ...base, exceptions: [...(base.exceptions || []), d.ev.date] }); const single = { ...base, ...patch, id: uid() }; delete single.rule; delete single.exceptions; S.saveEvent(single, true); toast('Moved this occurrence only.'); return; }
    S.saveEvent({ ...d.ev, ...patch }, true);
    if (d.ev.taskId) { const t = S.findTask(d.ev.taskId); if (t) S.saveTask({ ...t, date: nd, kind: 'timed', start: patch.start, dur: d.e - d.s }); }
  };
  const onDrop = e => {
    e.preventDefault(); const data = e.dataTransfer.getData('text/plain'); if (!data.startsWith('task:')) return;
    const t = S.findTask(data.slice(5)); if (!t) return; const p = at(e.clientX, e.clientY); const dur = t.dur || 30; const id = uid();
    S.saveEvent({ id, title: t.title, date: days[p.ci], start: fromMin(p.m), end: fromMin(Math.min(1440, p.m + dur)), allDay: false, cat: t.cat || 'personal', taskId: t.id }, true);
    S.saveTask({ ...t, date: days[p.ci], kind: 'timed', start: fromMin(p.m), dur, eventId: id }); toast(`Blocked ${fmtTime(p.m)} for “${t.title}”.`);
  };
  return html`<div>
    <div class="cal-head" style=${{ gridTemplateColumns: gridCols }}>${days.map((d, i) => { const tot = evsByDay[i].reduce((a, e) => a + evDur(e), 0); return html`<button class=${'dh' + (d === t0 ? ' today' : '')} onClick=${() => setV({ calView: 'day', calDate: d })} aria-label=${`Open ${fmtFull(d)}`}><div class="lbl-s">${DAYS[dow(d)].slice(0, 3).toLowerCase()}</div><div class="d2 tnum">${pd(d).getDate()}</div><div class="muted tnum" style=${{ fontSize: '12px', marginTop: '4px' }}>${tot ? fmtDur(tot) + ' blocked' : ' '}</div></button>`; })}</div>
    <div class="cal-allday" style=${{ gridTemplateColumns: gridCols }}>${days.map((d, i) => html`<div>${evsByDay[i].filter(e => e.allDay).map(e => html`<button class="adchip" style=${{ '--c': catVar(e.cat) }} onClick=${() => setV({ calOpen: { id: e.baseId || e.id, date: d } })}>${e.title}</button>`)}</div>`)}</div>
    <div class="cal-grid" ref=${box}>
      <div style=${{ position: 'relative', height: 24 * HOUR_H + 'px' }}>
        ${Array.from({ length: 24 }, (_, hh) => html`<div class="tl-slot" style=${{ top: hh * HOUR_H + 'px', left: '58px' }}></div><div class="tl-slot half" style=${{ top: hh * HOUR_H + HOUR_H / 2 + 'px', left: '58px' }}></div>${hh ? html`<div class="tl-hour tnum" style=${{ top: hh * HOUR_H + 'px', left: 0 }}>${fmtTime(hh * 60)}</div>` : null}`)}
        <div class="cal-cols" ref=${cols} style=${{ gridTemplateColumns: gridCols, height: 24 * HOUR_H + 'px' }} onDragOver=${e => e.preventDefault()} onDrop=${onDrop}>
          ${days.map((d, ci) => {
            const evs = evsByDay[ci].filter(e => !e.allDay).map(e => drag && drag.ev && (drag.ev.id === e.id) && drag.kind !== 'new' && !drag.alt ? null : e).filter(Boolean);
            const ghost = drag && drag.ev && drag.kind !== 'new' && drag.ci === ci ? { ...drag.ev, start: fromMin(drag.s), end: fromMin(drag.e), id: '__ghost' } : null;
            const list = ghost ? [...evs, ghost] : evs;
            const lanes = laneLayout(list, e => toMin(e.start), e => Math.max(toMin(e.start) + 15, toMin(e.end)));
            const we = dow(d) === 0 || dow(d) === 6;
            return html`<div class=${'cal-col' + (we ? ' we' : '')} onPointerDown=${e => { if (e.target === e.currentTarget) setDraft(null); startCreate(e); }} onPointerMove=${moveCreate} onPointerUp=${endCreate}>
              ${d === t0 ? html`<div class="tl-now" style=${{ top: nm * MIN_PX + 'px', left: 0 }}></div>` : null}
              ${list.map(e => { const s = toMin(e.start), en = Math.max(s + 15, toMin(e.end)); const L = lanes.get(e.id) || { lane: 0, lanes: 1 }; const w = 100 / L.lanes; const task = e.taskId ? S.findTask(e.taskId) : null;
                return html`<div class=${'blk' + (e.id === '__ghost' ? ' drag' : '') + (task && task.done ? ' done' : '')} style=${{ '--c': catVar(e.cat), top: s * MIN_PX + 1 + 'px', height: Math.max(18, (en - s) * MIN_PX - 2) + 'px', left: `calc(${L.lane * w}% + 2px)`, width: `calc(${w}% - 4px)`, fontSize: '13px', padding: '3px 6px 3px 7px' }}
                  role="button" tabindex="0" aria-label=${`${e.title}, ${fmtTime(e.start)} to ${fmtTime(e.end)}`} onKeyDown=${k => { if (k.key === 'Enter') setV({ calOpen: { id: e.baseId || e.id, date: d } }); }}

                </div>`; })}
              ${drag && drag.kind === 'new' && drag.ci === ci ? html`<div class="ghostblk" style=${{ top: drag.a * MIN_PX + 'px', height: (drag.b - drag.a) * MIN_PX + 'px' }}>${fmtTime(drag.a)}–${fmtTime(Math.min(1440, drag.b))}</div>` : null}
              ${draft && draft.date === d ? html`<div class="tl-new" style=${{ top: toMin(draft.start) * MIN_PX + 'px', minHeight: (toMin(draft.end) - toMin(draft.start)) * MIN_PX + 'px' }} onPointerDown=${e => e.stopPropagation()}>
                <div class="muted tnum" style=${{ fontSize: '11px' }}>${fmtTime(draft.start)}–${fmtTime(draft.end)}</div>
                <input autofocus aria-label="New event title" placeholder="Event title, press Enter" value=${title} onInput=${e => setTitle(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } if (e.key === 'Escape') { liveD.current = false; setDraft(null); setTitle(''); } }} onBlur=${() => { if (title.trim()) saveDraft(); else { liveD.current = false; setDraft(null); } }} />

function MonthGrid({ date, visible }) {
  const t0 = todayStr(); const ws = S.settings().weekStart; const first = monthStart(date); const start = weekStart(first, ws);
  const cells = Array.from({ length: 42 }, (_, i) => addDays(start, i)); const m = date.slice(0, 7);
  const heads = Array.from({ length: 7 }, (_, i) => DAYS[(ws + i) % 7].slice(0, 3));
  const drop = (e, d) => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (!id.startsWith('ev:')) return; const ev = S.findEvent(id.slice(3)); if (!ev || ev.rule) { toast('Repeating events move from the day or week view.'); return; } S.saveEvent({ ...ev, date: d }, true); };
  return html`<div class="month" role="grid" aria-label="Month">
    ${heads.map(hd => html`<div class="mh">${hd.toLowerCase()}</div>`)}
    ${cells.map(d => { const evs = S.eventsOn(d).filter(visible); return html`<div class=${'mc' + (d.slice(0, 7) !== m ? ' out' : '') + (d === t0 ? ' today' : '')} onClick=${e => { if (e.target === e.currentTarget) setV({ calOpen: { id: 'new', date: d, start: '09:00', end: '10:00', title: '', cat: 'personal', allDay: false } }); }} onDragOver=${e => e.preventDefault()} onDrop=${e => drop(e, d)}>
      <button class="n tnum" aria-label=${`Open ${fmtFull(d)}`} onClick=${() => setV({ calView: 'day', calDate: d })}>${pd(d).getDate()}</button>
      ${evs.slice(0, 3).map(e => html`<button class="adchip" draggable=${!e.recurring} onDragStart=${ev => ev.dataTransfer.setData('text/plain', 'ev:' + e.id)} style=${{ '--c': catVar(e.cat) }} onClick=${() => setV({ calOpen: { id: e.baseId || e.id, date: d } })}>${e.allDay ? '' : fmtTime(e.start) + ' '}${e.title}</button>`)}
      ${evs.length > 3 ? html`<button class="txtbtn" style=${{ fontSize: '10px', textAlign: 'left' }} onClick=${() => setV({ calView: 'day', calDate: d })}>+${evs.length - 3} more</button>` : null}
    </div>`; })}
  </div>`;

function EventPanel({ ev, onClose }) {
  const isNew = ev.id === 'new';
  const [f, setF] = useState(() => ({ title: '', date: todayStr(), start: '09:00', end: '10:00', allDay: false, cat: 'personal', loc: '', notes: '', reminder: '', ...ev, rule: ev.rule ? { ...ev.rule } : { type: 'none', days: [], until: null } }));
  const [scope, setScope] = useState(null);
  const up = p => setF({ ...f, ...p });
  const task = ev.taskId ? S.findTask(ev.taskId) : null;
  const valid = () => { if (!f.title.trim()) { toast('Add a title.'); return false; } if (!f.allDay && toMin(f.end) <= toMin(f.start)) { toast('End time must be after the start.'); return false; } return true; };
  const normalized = () => { const o = { ...f, title: f.title.trim() }; if (!o.rule || o.rule.type === 'none') o.rule = null; else if (o.rule.type !== 'weekly') o.rule = { ...o.rule, days: [] }; else if (!o.rule.days.length) o.rule = { ...o.rule, days: [dow(o.date)] }; if (o.allDay) { o.start = null; o.end = null; } return o; };
  const save = (sc) => {
    if (!valid()) return; const o = normalized();
    if (isNew) { S.saveEvent({ ...o, id: uid() }); toast('Event added.'); onClose(); return; }
    if (ev.recurring) {
      if (!sc) { setScope('save'); return; }
      const base = S.findEvent(ev.baseId);

/* Tag-to-folder box: type a folder or subfolder path, pick it, or create it */
function FolderBox({ value, onPick, autofocus }) {
  const [q, setQ] = useState(''); const [open, setOpen] = useState(!!autofocus); const [hi, setHi] = useState(0);
  const paths = S.folders().map(f => ({ id: f.id, path: S.folderPath(f.id) })).sort((a, b) => a.path.localeCompare(b.path));
  const ql = q.trim().toLowerCase().replace(/\s*\/\s*/g, ' / ');
  const matches = paths.filter(p => !ql || p.path.toLowerCase().includes(ql));
  const exact = paths.some(p => p.path.toLowerCase() === ql);
  const opts = [{ id: null, path: 'Inbox (no folder)', inbox: true }, ...matches];
  if (ql && !exact) opts.push({ create: q.trim().replace(/\s*\/\s*/g, ' / ') });
  const choose = o => { const id = o.create ? S.ensureFolderPath(o.create) : o.id; setQ(''); setOpen(false); onPick(id); };
  const key = e => { if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setHi(h => Math.min(opts.length - 1, h + 1)); } if (e.key === 'ArrowUp') { e.preventDefault(); setHi(h => Math.max(0, h - 1)); } if (e.key === 'Enter') { e.preventDefault(); const o = opts[clamp(ql && !exact && matches.length === 0 ? opts.length - 1 : hi, 0, opts.length - 1)]; if (o) choose(o); } if (e.key === 'Escape') { setOpen(false); e.stopPropagation(); } };
  return html`<div class="ftag">
    <div style=${{ display: 'flex', alignItems: 'center', gap: '10px', borderBottom: '1px solid var(--line-2)' }}>
      <span class="lbl-s" style=${{ whiteSpace: 'nowrap' }}>Folder</span>
      <input class="input" style=${{ border: 0 }} autofocus=${autofocus} aria-label="Tag to folder" placeholder=${value ? S.folderPath(value) : 'Tag to folder, e.g. Academic / Goals'} value=${q} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 160)} onInput=${e => { setQ(e.target.value); setOpen(true); setHi(e.target.value ? 1 : 0); }} onKeyDown=${key} />
    </div>
    ${open ? html`<div class="opts menu" role="listbox">${opts.map((o, i) => html`<button role="option" aria-selected=${i === hi} class=${i === hi ? 'on' : ''} onMouseDown=${e => e.preventDefault()} onClick=${() => choose(o)}>${o.create ? html`<span>Create <b>“${o.create}”</b></span>` : o.inbox ? html`<span class="muted">${o.path}</span>` : html`<span>${highlight(o.path, ql)}</span>${o.id === value ? html`<span class="muted" style=${{ float: 'right' }}>current</span>` : null}`}</button>`)}</div>` : null}
  </div>`;
}

/* ===== Demo data (marked demo:true; Settings can clear it) ===== */
function loadDemo() {
  const t0 = todayStr(); let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const D = { demo: true };
  const ago = n => addDays(t0, -n);
  const created = ago(140);
  const M = {
    sleep: { id: 'dm-sleep', name: 'Sleep', type: 'duration', target: 450, direction: 'up', agg: 'avg', category: 'Health', showToday: true, order: 0 },
    deep: { id: 'dm-deep', name: 'Deep work', type: 'duration', target: 240, direction: 'up', agg: 'sum', category: 'Work', showToday: true, order: 1 },
    gym: { id: 'dm-gym', name: 'Running / gym', type: 'yesno', category: 'Health', showToday: true, order: 2, agg: 'sum' },
    run: { id: 'dm-run', name: 'Running', type: 'number', unit: 'km', direction: 'up', agg: 'sum', category: 'Health', showToday: true, order: 3 },
    mood: { id: 'dm-mood', name: 'Mood', type: 'rating', direction: 'up', agg: 'avg', category: 'Mind', showToday: true, order: 4 },
    water: { id: 'dm-water', name: 'Water', type: 'count', unit: 'glasses', target: 8, direction: 'up', agg: 'avg', category: 'Health', showToday: true, order: 5 },
    read: { id: 'dm-read', name: 'Reading', type: 'duration', target: 30, direction: 'up', agg: 'sum', category: 'Learning', showToday: false, order: 6 },
    news: { id: 'dm-news', name: 'News read', type: 'yesno', category: 'Learning', showToday: false, order: 7, agg: 'sum' },
  };
  const existing = S.list('metrics').filter(m => !m.demo);
  S.setList('metrics', [...existing, ...Object.values(M).map(m => ({ ...m, created, ...D }))]);
  const ent = {}; const put = (mid, d, v) => { const y = d.slice(0, 4); const k = `e~${mid}~${y}`; (ent[k] = ent[k] || { mid, year: +y, d: {}, demo: true }).d[d] = { v }; };
  for (let i = 120; i >= 1; i--) {
    const d = ago(i); const wd = dow(d); const trend = (120 - i) / 120;
    if (rnd() < 0.92) put(M.sleep.id, d, Math.round(390 + rnd() * 90 + trend * 20));
    if (wd >= 1 && wd <= 5 && rnd() < 0.9) put(M.deep.id, d, Math.round(120 + rnd() * 150 + trend * 40));
    else if (rnd() < 0.3) put(M.deep.id, d, Math.round(60 + rnd() * 90));

function netErr(error) {
  const m = String((error && (error.message || error.details)) || '');
  const st = error && error.status;
  if (!navigator.onLine || /fetch|network|load failed|timeout/i.test(m) || st === 0 || st >= 500 || st === 429) return 'unavailable';
  if (st === 413 || /too large|payload/i.test(m)) return 'invalid_argument';
  if (st === 401 || st === 403 || /jwt|permission|policy/i.test(m)) return 'auth';
  return 'other';
}

/* Write path: same debounce as before; failed writes stay marked and retry until they land */
async function flush(col, id, retry = 0) {
  const key = col + '/' + id;
  if (!DB.db) return;
  const seq = DB.seq[key];
  const data = DB.docs[col][id];
  DB.dirty[key] = 1; saveDirty();
  try {
    const ref = DB.db.collection(col).doc(id);
    if (data) await ref.set(clone(data)); else await ref.delete();
    if (DB.seq[key] === seq) { delete DB.pending[key]; delete DB.dirty[key]; saveDirty(); }
  } catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' || code === 'auth') {
      clearTimeout(DB.timers[key]);
      DB.timers[key] = setTimeout(() => flush(col, id, retry + 1), Math.min(60000, 2000 * Math.pow(2, retry)));
      if (retry === 2) toast('Offline. Your changes are kept on this device and will sync when you reconnect.');
      return;
    }
    delete DB.pending[key]; delete DB.dirty[key]; saveDirty();
    if (code === 'invalid_argument') toast('That item is too large to save. Shorten it or remove an image.');
    else toast('Could not save a change. Try editing it again.');
  }
}

function makeShim(sb, uid) {
  return {
    collection: col => ({
      doc: id => ({
        async set(data) {
          const ts = new Date().toISOString(); DB.lastWrite[col + '/' + id] = ts;
          const { error } = await sb.from('docs').upsert({ user_id: uid, col, id, data, updated_at: ts }, { onConflict: 'user_id,col,id' });
          if (error) { const e = new Error(error.message); e.code = netErr(error); throw e; }
        },
        async delete() {
          DB.lastWrite[col + '/' + id] = new Date().toISOString();
          const { error } = await sb.from('docs').delete().match({ user_id: uid, col, id });
          if (error) { const e = new Error(error.message); e.code = netErr(error); throw e; }
        }
      })
    })
  };
}

async function fetchAll(sb) {
  let rows = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from('docs').select('col,id,data,updated_at').order('col').order('id').range(from, from + 999);
    if (error) { const e = new Error(error.message); e.code = netErr(error); throw e; }
    rows = rows.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return rows;
}

/* Server copy wins, except for keys this device changed and has not yet saved */
function applyServer(rows) {
  const next = { s: {}, n: {} };
  rows.forEach(r => { if (next[r.col]) next[r.col][r.id] = r.data; });
  const local = new Set([...Object.keys(DB.pending), ...Object.keys(DB.dirty)]);
  local.forEach(k => { const [c, ...rest] = k.split('/'); const id = rest.join('/'); if (!next[c]) return; if (DB.docs[c][id]) next[c][id] = DB.docs[c][id]; else delete next[c][id]; });
  DB.docs = next; DB.loaded = { s: true, n: true };
  Object.keys(DB.dirty).forEach(k => { if (!DB.pending[k]) { const [c, ...rest] = k.split('/'); queueWrite(c, rest.join('/')); } });
}

async function connectDb() {
  if (!window.supabase || !window.supabase.createClient) { DB.mode = 'local'; emit(); return; }
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  DB.sb = sb;
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) { session = null; }
  if (!session) { DB.mode = 'auth'; emit(); return; }
  startSync(sb, session.user);
}

async function startSync(sb, user) {
  const uid = user.id;
  DB.userEmail = user.email || '';
  DB.signOut = async () => {
    flushAll(); await new Promise(r => setTimeout(r, 700));
    try { await sb.auth.signOut(); } catch (e) { }
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(DIRTY_KEY); } catch (e) { }
    location.hash = ''; location.reload();
  };
  DB.db = makeShim(sb, uid);
  DB.mode = 'syncing'; emit();
  const hadLocal = DB.localOnly && (Object.keys(DB.docs.s).length + Object.keys(DB.docs.n).length) > 0;
  const localCopy = clone(DB.docs);

  const load = async first => {
    try {
      const rows = await fetchAll(sb);
      applyServer(rows);
      if (first) {
        DB.mode = 'synced'; DB.localOnly = false;
        if (!rows.length && hadLocal) {
          ['s', 'n'].forEach(col => Object.entries(localCopy[col]).forEach(([id, d]) => { DB.docs[col][id] = d; queueWrite(col, id); }));
          toast('Moved your saved data into your account.');
        }
      } else DB.mode = 'synced';
      emit(); saveLocal();
      return true;
    } catch (e) {
      if (first) {
        DB.mode = 'local'; emit(); toast(e && e.code === 'unavailable' ? 'Offline. Showing the copy saved on this device.' : 'Could not load from the database: ' + ((e && e.message) || 'unknown error'));
        Object.keys(DB.dirty).forEach(k => { if (!DB.pending[k]) { const [c, ...rest] = k.split('/'); queueWrite(c, rest.join('/')); } });
        const retry = setInterval(async () => { if (await load(false)) clearInterval(retry); }, 15000);
      }
      return false;
    }
  };
  await load(true);

  // Live changes from other devices
  sb.channel('docs-' + uid)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
      const row = p.eventType === 'DELETE' ? p.old : p.new;
      if (!row || (row.user_id && row.user_id !== uid) || !DB.docs[row.col]) return;
      const key = row.col + '/' + row.id;
      if (DB.pending[key] || DB.dirty[key]) return;
      const lw = DB.lastWrite[key];
      if (p.eventType === 'DELETE') { if (lw && Date.now() - Date.parse(lw) < 8000) return; delete DB.docs[row.col][row.id]; }
      else { if (lw && row.updated_at && row.updated_at < lw) return; DB.docs[row.col][row.id] = row.data; }
      emit(); saveLocal();
    })
    .subscribe();

  // Catch up after the phone wakes or the network returns
  let lastPull = Date.now();
  const catchUp = () => { if (Date.now() - lastPull < 5000) return; lastPull = Date.now(); load(false); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') catchUp(); });
  window.addEventListener('online', () => { lastPull = 0; catchUp(); });
  window.addEventListener('focus', catchUp);
  setInterval(() => { if (document.visibilityState === 'visible') catchUp(); }, 30000);

  // Note images: private bucket, long-lived signed links
  DB.assets = {
    async upload(file) {
      if (file.size > 20 * 1024 * 1024) { const e = new Error('too large'); e.code = 'too_large'; throw e; }
      const ext = ((file.type.split('/')[1] || 'png').replace('jpeg', 'jpg'));
      const path = uid + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)) + '.' + ext;
      const up = await sb.storage.from('note-images').upload(path, file, { contentType: file.type, upsert: false });
      if (up.error) throw up.error;
      const sg = await sb.storage.from('note-images').createSignedUrl(path, 60 * 60 * 24 * 365 * 20);
      if (sg.error) throw sg.error;
      return { id: path, url: sg.data.signedUrl };
    }
  };
  // Backups download straight to the device
  DB.downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };
  emit();
}

      }
      const fn = mode === 'up' ? sb.auth.signUp.bind(sb.auth) : sb.auth.signInWithPassword.bind(sb.auth);
      const { data, error } = await fn({ email: email.trim(), password: pw, options: mode === 'up' ? { emailRedirectTo: location.origin + location.pathname } : undefined });
      if (error) throw error;
      if (!data.session) { setMsg('Check your email to confirm the account, then sign in here.'); setMode('in'); setBusy(false); return; }
      startSync(sb, data.session.user);
    } catch (err) {
      const m = String(err && err.message || '');
      setMsg(/invalid login/i.test(m) ? 'Wrong email or password.' : /not allowed|signups/i.test(m) ? 'New accounts are switched off for this app.' : /confirm/i.test(m) ? 'Confirm your email first, then sign in.' : /password/i.test(m) ? m : 'Could not reach the server. Check your connection.');
      setBusy(false);
    }
  };
  return html`<div class="auth">
    <div class="auth-in">
      <div class="mark">master<span>.</span></div>
      <p class="auth-q">The curse of discipline is that every day looks the same. The curse of indiscipline is that every year does.</p>
      <form onSubmit=${submit} class="fields">
        <div class="field"><label for="au-e">Email</label><input id="au-e" class="input" type="email" autocomplete="email" required value=${email} onInput=${e => setEmail(e.target.value)} /></div>
        ${mode !== 'reset' ? html`<div class="field"><label for="au-p">Password</label><input id="au-p" class="input" type="password" autocomplete=${mode === 'up' ? 'new-password' : 'current-password'} minlength="6" required value=${pw} onInput=${e => setPw(e.target.value)} /></div>` : null}
        <button class="btn accent" type="submit" disabled=${busy}>${busy ? 'One moment…' : mode === 'up' ? 'Create account' : mode === 'reset' ? 'Send reset link' : 'Sign in'}</button>
      </form>
      ${msg ? html`<p class="auth-msg">${msg}</p>` : null}
      <div class="auth-alt">
        ${mode === 'in' ? html`<button class="txtbtn" onClick=${() => { setMode('up'); setMsg(''); }}>First time? Create your account</button><button class="txtbtn" onClick=${() => { setMode('reset'); setMsg(''); }}>Forgot password</button>` : html`<button class="txtbtn" onClick=${() => { setMode('in'); setMsg(''); }}>Back to sign in</button>`}
      </div>
    </div>
  </div>`;
}

/* Password reset links land here with a recovery session: ask for the new password once */
(function watchRecovery() {
  const t = setInterval(() => {
    if (!DB.sb) return; clearInterval(t);
    DB.sb.auth.onAuthStateChange(async ev => {
      if (ev !== 'PASSWORD_RECOVERY') return;
      const np = prompt('Choose a new password (6+ characters)');
      if (np && np.length >= 6) { const { error } = await DB.sb.auth.updateUser({ password: np }); toast(error ? 'Could not update the password.' : 'Password updated.'); }
    });
  }, 200);
})();
/* ===== App and boot ===== */
function App() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(x => x + 1); DB.subs.add(f); f(); return () => DB.subs.delete(f); }, []);
  const s = S.settings();
  useEffect(() => { const r = document.documentElement; if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme); else r.removeAttribute('data-theme'); }, [s.theme]);
  useEffect(() => { const r = document.documentElement; if (s.typeface === 'serif') r.setAttribute('data-type', 'serif'); else r.removeAttribute('data-type'); }, [s.typeface]);
  useEffect(() => {
    const k = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return; const t = e.target;
      if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
      if (V.overlay || V.quick || UI.confirm) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newNote(V.page === 'notes' && V.notesView ? V.notesView : { kind: 'inbox' }); }
      else if (e.key === '/') { e.preventDefault(); setV({ overlay: 'search' }); }
      else if (e.key === '?') { e.preventDefault(); setV({ overlay: 'shortcuts' }); }
    };
    window.addEventListener('keydown', k);
    const hc = () => { const p = location.hash.slice(1); if (PAGES.some(x => x[0] === p) && p !== V.page) go(p); };
    window.addEventListener('hashchange', hc);
    const t = setInterval(checkReminders, 30000);
    return () => { window.removeEventListener('keydown', k); window.removeEventListener('hashchange', hc); clearInterval(t); };
  }, []);
  if (DB.mode === 'auth') return html`<${AuthScreen} />`;
  const Page = { today: Today, tracker: Tracker, goals: Goals, todo: Todo, notes: Notes }[V.page] || Today;
  return html`<${Fragment}>
    <${Strip} />
    <${Topbar} />
    <main id="main"><${Page} /></main>
    <${BottomNav} />
    ${V.quick ? html`<${QuickAdd} key=${V.quick} />` : null}
    ${V.overlay === 'search' ? html`<${SearchOverlay} />` : null}
    ${V.overlay === 'settings' ? html`<${Settings} />` : null}
    ${V.overlay === 'shortcuts' ? html`<${Shortcuts} />` : null}
    ${V.overlay === 'eod' ? html`<${EodPrompt} />` : null}
    ${V.overlay === 'exporttext' ? html`<${ExportText} />` : null}
    <${UiHost} />
  <//>`;
}

function onReady() {
  // Trash older than 30 days is emptied
  const cutoff = Date.now() - 30 * 864e5;
  S.notes().forEach(n => { if (n.deletedAt && Date.parse(n.deletedAt) < cutoff) S.deleteNoteForever(n.id); });
  // Unfinished full-day tasks from earlier days
  const s = S.settings(); const t0 = todayStr();
  if (s.carry === 'ask') { if (pendingCarry().length && s.lastEod !== t0 && !V.overlay) { setV({ overlay: 'eod' }); S.setSettings({ lastEod: t0 }); } }
  else autoCarry();
  checkReminders();
}
/* Browsers only honour autofocus on page load; focus inputs that appear later (inline adds, dialogs) */
function watchAutofocus() {
  const focusNew = root => { const list = root.querySelectorAll ? Array.from(root.querySelectorAll('[autofocus]:not([data-af])')) : []; if (root.matches && root.matches('[autofocus]:not([data-af])')) list.unshift(root); const el = list[list.length - 1]; list.forEach(x => x.setAttribute('data-af', '1')); if (el) requestAnimationFrame(() => { try { el.focus({ preventScroll: el.closest('.tl,.cal-grid') ? true : false }); } catch (e) { el.focus(); } }); };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) focusNew(n); }))).observe(document.body, { childList: true, subtree: true });
}
(function boot() {
  watchAutofocus();
  loadLocal();
  const p = (location.hash || '').slice(1); if (PAGES.some(x => x[0] === p)) V.page = p;
  render(html`<${App} />`, document.getElementById('app'));
  connectDb();
  let tries = 0;
  const wait = setInterval(() => { if (DB.mode === 'auth') return; tries++; if (DB.mode === 'synced' || DB.mode === 'local' || tries > 40) { clearInterval(wait); onReady(); } }, 300);
  // a tick on every minute keeps clocks, "now" lines and "next" up to date on every screen
  setTimeout(() => { emit(); setInterval(emit, 60000); }, (60 - new Date().getSeconds()) * 1000 + 50);
  // re-check at midnight so Today rolls over
  let day = todayStr(); setInterval(() => { if (todayStr() !== day) { day = todayStr(); setV({ todayDate: null, todoDate: null }); onReady(); } }, 60000);
})();
</script></body></html>
